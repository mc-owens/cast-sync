<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audition Day | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .ad-card {
      background: #fffdf7;
      border: 1px solid #e8dfc8;
      border-left: 3px solid #c9a84c;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .ad-card-name {
      font-size: 15px;
      font-weight: 600;
      color: #2d2512;
      margin-bottom: 3px;
    }
    .ad-card-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }
    .ad-card-stats {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #777;
    }
    .ad-stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(201,168,76,.1);
      border: 1px solid rgba(201,168,76,.3);
      border-radius: 20px;
      padding: 1px 10px;
      font-size: 12px;
      color: #8a6820;
    }
    .ad-stat-pill.cb {
      background: rgba(90,127,160,.08);
      border-color: rgba(90,127,160,.25);
      color: #3d6080;
    }
    .btn-go-live {
      font-size: 13px;
      font-weight: 600;
      background: #c9a84c;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 6px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-go-live:hover { background: #b8973d; color: white; }
    .btn-delete-day {
      font-size: 12px;
      color: #aaa;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
    }
    .btn-delete-day:hover { color: #c0392b; }
    .page-title-bar {
      border-left: 3px solid #c9a84c;
      padding-left: 12px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell.js"></script>

  <div class="app-main">
    <div class="container mt-5" style="max-width:600px;">

      <div class="d-flex align-items-center justify-content-between mb-1">
        <h4 class="mb-0 fw-semibold page-title-bar">Audition Day</h4>
        <button class="btn btn-sm btn-dark" id="new-day-btn">+ New Audition Day</button>
      </div>
      <p class="text-muted mb-4" style="font-size:13px;">Rate dancers in real time during auditions. Auto-saves as you go.</p>

      <div id="days-list">
        <p class="text-muted" style="font-size:13px;">Loading…</p>
      </div>

    </div>
  </div>

  <!-- Create modal -->
  <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:420px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:16px;">New Audition Day</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div id="create-error" class="alert alert-danger d-none mb-3" style="font-size:13px;"></div>
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Name</label>
            <input type="text" id="new-day-name" class="form-control" placeholder="e.g. Main Audition, Callbacks" autocomplete="off" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Date <span class="text-muted fw-normal">(optional)</span></label>
            <input type="date" id="new-day-date" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label" style="font-size:13px;font-weight:600;">Grouping</label>
            <div class="d-flex gap-1">
              <input type="radio" class="btn-check" name="day-group-mode" id="day-mode-size" value="size" checked autocomplete="off">
              <label class="btn btn-outline-secondary btn-sm flex-fill" for="day-mode-size" style="font-size:12px;">Dancers per group</label>
              <input type="radio" class="btn-check" name="day-group-mode" id="day-mode-count" value="count" autocomplete="off">
              <label class="btn btn-outline-secondary btn-sm flex-fill" for="day-mode-count" style="font-size:12px;">Total groups</label>
            </div>
          </div>
          <div class="row g-3 mb-1">
            <div class="col-6">
              <label class="form-label" id="day-group-value-label" style="font-size:13px;font-weight:600;">Group Size</label>
              <input type="number" id="new-day-groupsize" class="form-control" value="8" min="1" max="9999">
            </div>
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Sort Dancers By</label>
              <select id="new-day-sort" class="form-select">
                <option value="number">Audition Number</option>
                <option value="last_name">Last Name</option>
                <option value="first_name">First Name</option>
              </select>
            </div>
          </div>
          <div id="group-size-preview" style="font-size:12px;color:#8a6820;margin-top:8px;min-height:18px;"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="create-day-btn">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm delete modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:360px;">
      <div class="modal-content">
        <div class="modal-body pt-4 pb-3 text-center">
          <p style="font-size:14px;font-weight:600;">Delete this audition day?</p>
          <p class="text-muted" style="font-size:13px;">All ratings will be permanently removed.</p>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-center gap-2">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirm-delete-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (async () => {
    const res  = await fetch('/api/auth/me');
    const user = await res.json();
    const isDirector = user.mode === 'director' || user.role === 'master';
    const isStaff    = !!user.isStaff;
    if (!res.ok || (!isDirector && !isStaff)) {
      window.location.href = 'login.html'; return;
    }

    // Staff need their session linked to a season — auto-detect or prompt
    if (isStaff && !user.orgId) {
      const ctx = await fetch('/api/audition-day/staff-context').then(r => r.json()).catch(() => null);
      if (!ctx || ctx.error) { window.location.href = 'login.html'; return; }
      if (ctx.select_required) {
        // Simple picker for staff with multiple seasons
        document.body.innerHTML = `<div style="max-width:400px;margin:80px auto;padding:24px;font-family:inherit;">
          <h5 style="font-weight:700;margin-bottom:16px;">Select Production</h5>
          ${ctx.seasons.map(s => `<button onclick="setStaffSeason(${s.season_id},${s.org_id},'${s.season_name}')"
            style="display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border:1px solid #e8dfc8;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;">${s.season_name}</button>`).join('')}
        </div>`;
        window.setStaffSeason = async (sid, oid, name) => {
          await fetch('/api/audition-day/staff-context');
          window.location.reload();
        };
        document.body.style.visibility = 'visible';
        return;
      }
    }

    document.getElementById('right-nav').innerHTML =
      `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    document.body.style.visibility = 'visible';
    if (isStaff) {
      const newDayBtn = document.getElementById('new-day-btn');
      if (newDayBtn) newDayBtn.style.display = 'none';
    }
    await loadDays(isStaff);
  })();

  let pendingDeleteId  = null;
  let seasonDancerCount = null;
  const createModal = new bootstrap.Modal(document.getElementById('createModal'));
  const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

  function formatDate(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadDays(staffMode = false) {
    const r    = await fetch('/api/audition-days');
    const days = r.ok ? await r.json() : [];
    const el   = document.getElementById('days-list');

    if (days.length === 0) {
      el.innerHTML = `<p class="text-muted" style="font-size:13px;margin-top:8px;">No audition days yet.${staffMode ? '' : ' Create one to get started.'}</p>`;
      return;
    }

    el.innerHTML = days.map(d => `
      <div class="ad-card">
        <div class="d-flex align-items-start justify-content-between gap-2">
          <div style="min-width:0;">
            <div class="ad-card-name">${escHtml(d.name)}</div>
            <div class="ad-card-meta">
              ${d.audition_date ? formatDate(d.audition_date) : 'No date set'}
            </div>
            <div class="ad-card-stats">
              <span>${d.dancer_count} dancer${d.dancer_count != 1 ? 's' : ''}</span>
              ${+d.combo_count  > 0 ? `<span style="font-size:12px;color:#777;">${d.combo_count} combo${+d.combo_count !== 1 ? 's' : ''}</span>` : ''}
              ${+d.rated_count  > 0 ? `<span class="ad-stat-pill">★ ${d.rated_count} rated</span>` : ''}
              ${+d.callback_count > 0 ? `<span class="ad-stat-pill cb">↩ ${d.callback_count} callback</span>` : ''}
            </div>
          </div>
          <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <a href="audition-day-live.html?id=${d.id}" class="btn-go-live">Go Live</a>
            ${staffMode ? '' : `<button class="btn-delete-day" data-id="${d.id}" title="Delete">✕</button>`}
          </div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.btn-delete-day').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingDeleteId = btn.dataset.id;
        deleteModal.show();
      });
    });
  }

  async function fetchDancerCount() {
    if (seasonDancerCount !== null) return seasonDancerCount;
    try {
      const r = await fetch('/api/dancers');
      const data = r.ok ? await r.json() : [];
      seasonDancerCount = data.length;
    } catch (e) { seasonDancerCount = 0; }
    return seasonDancerCount;
  }

  function dayGroupMode() {
    return document.querySelector('input[name="day-group-mode"]:checked')?.value || 'size';
  }

  function updateGroupPreview() {
    const mode = dayGroupMode();
    const val  = parseInt(document.getElementById('new-day-groupsize').value) || 0;
    const n    = seasonDancerCount;
    const el   = document.getElementById('group-size-preview');
    if (n === null || !val) { el.textContent = ''; return; }
    el.style.color = '#8a6820';
    if (n === 0) { el.textContent = 'No auditionees yet.'; return; }

    if (mode === 'size') {
      if (val > n) {
        el.textContent = `Group size cannot exceed ${n} (your auditionee count).`;
        el.style.color = '#c0392b'; return;
      }
      const g   = Math.ceil(n / val);
      const rem = n % val;
      const lastNote = rem > 0 ? ` Last group has ${rem}.` : '';
      el.textContent = `${n} auditionee${n !== 1 ? 's' : ''} · ${val} per group = ${g} group${g !== 1 ? 's' : ''}.${lastNote}`;
    } else {
      if (val > n) {
        el.textContent = `Can't have more groups than auditionees (${n}).`;
        el.style.color = '#c0392b'; return;
      }
      const base  = Math.floor(n / val);
      const extra = n % val;
      if (extra === 0) {
        el.textContent = `${n} auditionees · ${val} groups of ${base}.`;
      } else {
        el.textContent = `${n} auditionees · ${extra} group${extra !== 1 ? 's' : ''} of ${base + 1}, ${val - extra} of ${base}.`;
      }
    }
  }

  document.getElementById('new-day-groupsize').addEventListener('input', updateGroupPreview);
  document.querySelectorAll('input[name="day-group-mode"]').forEach(r => {
    r.addEventListener('change', () => {
      const isCount = r.value === 'count';
      document.getElementById('day-group-value-label').textContent = isCount ? 'Number of Groups' : 'Group Size';
      document.getElementById('new-day-groupsize').value = isCount ? '5' : '8';
      updateGroupPreview();
    });
  });

  document.getElementById('new-day-btn').addEventListener('click', async () => {
    document.getElementById('new-day-name').value = '';
    document.getElementById('new-day-date').value = '';
    document.getElementById('new-day-groupsize').value = '8';
    document.getElementById('new-day-sort').value = 'number';
    document.getElementById('create-error').classList.add('d-none');
    document.getElementById('group-size-preview').textContent = '';
    document.getElementById('day-mode-size').checked = true;
    document.getElementById('day-group-value-label').textContent = 'Group Size';
    createModal.show();
    setTimeout(() => document.getElementById('new-day-name').focus(), 300);
    await fetchDancerCount();
    document.getElementById('new-day-groupsize').max = seasonDancerCount || 9999;
    updateGroupPreview();
  });

  document.getElementById('create-day-btn').addEventListener('click', async () => {
    const name       = document.getElementById('new-day-name').value.trim();
    const date       = document.getElementById('new-day-date').value;
    const groupSize  = document.getElementById('new-day-groupsize').value;
    const sortOrder  = document.getElementById('new-day-sort').value;
    const errEl      = document.getElementById('create-error');
    errEl.classList.add('d-none');

    const mode = dayGroupMode();
    if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.remove('d-none'); return; }
    const val = parseInt(groupSize) || 0;
    if (val < 1) { errEl.textContent = 'Must be at least 1.'; errEl.classList.remove('d-none'); return; }
    if (seasonDancerCount && val > seasonDancerCount) {
      errEl.textContent = mode === 'size'
        ? `Group size cannot exceed the number of auditionees (${seasonDancerCount}).`
        : `Can't have more groups than auditionees (${seasonDancerCount}).`;
      errEl.classList.remove('d-none'); return;
    }

    const btn = document.getElementById('create-day-btn');
    btn.disabled = true;
    try {
      const r = await fetch('/api/audition-days', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mode === 'count'
          ? { name, audition_date: date || null, group_count: parseInt(groupSize), sort_order: sortOrder }
          : { name, audition_date: date || null, group_size: parseInt(groupSize), sort_order: sortOrder })
      });
      const data = await r.json();
      if (!r.ok) { errEl.textContent = data.error || 'Could not create.'; errEl.classList.remove('d-none'); return; }
      createModal.hide();
      window.location.href = `audition-day-live.html?id=${data.id}`;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const btn = document.getElementById('confirm-delete-btn');
    btn.disabled = true;
    try {
      await fetch(`/api/audition-days/${pendingDeleteId}`, { method: 'DELETE' });
      deleteModal.hide();
      pendingDeleteId = null;
      await loadDays();
    } finally {
      btn.disabled = false;
    }
  });

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  </script>
</body>
</html>
