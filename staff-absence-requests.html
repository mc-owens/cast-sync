<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absence Requests | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    .request-card { border: 1px solid #e8dfc8; border-left: 3px solid #c9a84c; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; background: #fffdf7; }
    .request-meta { font-size: 12px; color: #a89070; }
    .section-header {
      display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0;
      border-bottom: 1px solid #e0d5b8; margin-bottom: 10px; font-weight: 600; font-size: 14px;
    }
    .section-header .chevron { font-size: 11px; color: #a89070; transition: transform .15s; }
    .section-header.collapsed .chevron { transform: rotate(-90deg); }
    .section-count { font-size: 12px; color: #a89070; font-weight: normal; }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell-staff.js"></script>

  <div class="app-main">
    <div class="container-fluid mt-4 px-4" style="max-width:820px;">

      <div class="mb-4" style="border-left:3px solid #c9a84c;padding-left:12px;">
        <h5 class="mb-0 fw-semibold">Absence Requests</h5>
        <p class="text-muted mb-0" style="font-size:13px;">Requests from dancers in your pieces. Status changes are made by the director.</p>
      </div>

      <div id="requests-container">
        <p class="text-muted" style="font-size:13px;">Loading...</p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(d) {
      if (!d) return '';
      const dt = new Date(d + 'T12:00:00');
      return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
    }

    const STATUS_LABELS = { pending: 'Pending', approved: 'Approved', denied: 'Denied' };
    const STATUS_COLORS = { pending: '#6c757d', approved: '#198754', denied: '#dc3545' };

    function renderCard(r) {
      const status = r.status || 'pending';
      const badge = `<span class="badge rounded-pill" style="background:${STATUS_COLORS[status] || '#6c757d'};color:#fff;font-size:12px;padding:4px 10px;">${STATUS_LABELS[status] || status}</span>`;
      const pieceLabel = escapeHtml(r.piece_name || '');
      const seasonLabel = r.season_name ? ` <span style="color:#a89070;">— ${escapeHtml(r.season_name)}</span>` : '';
      return `
        <div class="request-card">
          <div class="d-flex align-items-start justify-content-between gap-2 flex-wrap">
            <div>
              <div style="font-weight:600;font-size:14px;">${escapeHtml(r.first_name)} ${escapeHtml(r.last_name)}</div>
              <div class="request-meta">${pieceLabel}${seasonLabel}</div>
            </div>
            ${badge}
          </div>
          <div style="margin-top:8px;font-size:13px;">
            <span style="font-weight:500;">${formatDate(r.absence_date)}</span>
            <span style="color:#a89070;"> &middot; ${escapeHtml(r.start_time)} to ${escapeHtml(r.end_time)}</span>
          </div>
          ${r.reason ? `<div style="margin-top:6px;font-size:13px;color:#374151;">${escapeHtml(r.reason)}</div>` : ''}
          ${r.documentation_link ? `<div style="margin-top:4px;font-size:12px;"><a href="${escapeHtml(r.documentation_link)}" target="_blank" rel="noopener">View documentation</a></div>` : ''}
        </div>`;
    }

    function renderSection(title, requests, expanded) {
      if (requests.length === 0) return '';
      const id = 'section-' + title.toLowerCase().replace(/\s+/g, '-');
      return `
        <div class="mb-4">
          <div class="section-header${expanded ? '' : ' collapsed'}" data-section="${id}">
            <span class="chevron">&#9660;</span>
            <span>${title}</span>
            <span class="section-count">${requests.length}</span>
          </div>
          <div id="${id}"${expanded ? '' : ' style="display:none"'}>
            ${requests.map(renderCard).join('')}
          </div>
        </div>`;
    }

    function render(requests) {
      const today = new Date().toISOString().slice(0, 10);
      const upcoming = requests.filter(r => r.absence_date >= today).sort((a, b) => a.absence_date.localeCompare(b.absence_date));
      const past     = requests.filter(r => r.absence_date < today).sort((a, b) => b.absence_date.localeCompare(a.absence_date));

      const container = document.getElementById('requests-container');
      if (requests.length === 0) {
        container.innerHTML = `<p class="text-muted" style="font-size:13px;">No absence requests found for your pieces yet.</p>`;
        return;
      }
      container.innerHTML = renderSection('Upcoming', upcoming, true) + renderSection('Past', past, false);

      container.addEventListener('click', e => {
        const header = e.target.closest('.section-header');
        if (!header) return;
        const id = header.dataset.section;
        const body = document.getElementById(id);
        const collapsed = header.classList.toggle('collapsed');
        body.style.display = collapsed ? 'none' : '';
      });
    }

    (async () => {
      try {
        const res  = await fetch('/api/auth/me');
        const user = await res.json();
        if (!res.ok || (!user.isStaff && user.role !== 'staff')) { window.location.href = 'login.html'; return; }
        document.getElementById('right-nav').innerHTML =
          `<a href="account.html">Account</a>` +
          (user.isDirector ? `<button id="switch-director-btn">Switch to Director</button>` : '') +
          (user.hasSubmissions ? `<button id="switch-auditionee-btn">Switch to Auditionee</button>` : '') +
          `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
        if (user.isDirector) {
          document.getElementById('switch-director-btn').addEventListener('click', async () => {
            await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'director' }) });
            window.location.href = 'org-select.html';
          });
        }
        if (user.hasSubmissions) document.getElementById('switch-auditionee-btn').addEventListener('click', async () => {
          await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'auditionee' }) });
          window.location.href = 'auditionForm.html';
        });
        document.getElementById('logout-btn').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = 'login.html';
        });
        document.body.style.visibility = 'visible';

        const arRes = await fetch('/api/staff/absence-requests');
        if (!arRes.ok) throw new Error();
        render(await arRes.json());
      } catch (err) {
        document.getElementById('requests-container').innerHTML =
          `<p class="text-danger" style="font-size:13px;">Could not load absence requests.</p>`;
      }
    })();
  </script>
</body>
</html>
