<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish Casting | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { visibility: visible !important; }
      #preview-card { border: none !important; box-shadow: none !important; }
      .preview-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .cast-name { font-size: 14px; margin: 2px 0; }
    .piece-block { padding-top: 16px; margin-bottom: 24px; }
    .theme-swatch {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: border-color .15s, transform .1s;
      flex-shrink: 0;
    }
    .theme-swatch.active { border-color: #1a1a1a; transform: scale(1.15); }
    .theme-swatch:hover { transform: scale(1.1); }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell.js"></script>

  <!-- Send confirmation modal -->
  <div class="modal fade" id="sendConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:12px;border:none;">
        <div class="modal-header" style="border-bottom:1px solid #f3f4f6;">
          <h5 class="modal-title" style="font-weight:700;">Send Cast List</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:20px 24px;">
          <p style="font-size:14px;color:#374151;margin-bottom:8px;">
            This will email the cast list to <strong id="confirm-count"></strong>.
          </p>
          <p style="font-size:13px;color:#6b7280;margin:0;">
            Make sure your cast list and message look right in the preview before sending. This cannot be undone.
          </p>
        </div>
        <div class="modal-footer" style="border-top:1px solid #f3f4f6;gap:8px;">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark" id="confirm-send-btn">Send Now</button>
        </div>
      </div>
    </div>
  </div>

  <div class="app-main">
  <div class="container-fluid mt-4 px-4" style="max-width:860px;">

    <!-- Controls -->
    <div class="no-print mb-4">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h5 class="mb-0 fw-semibold">Publish Casting</h5>
          <p class="text-muted mb-0" style="font-size:13px;" id="subtitle">Loading…</p>
        </div>
        <a href="casting.html" class="btn btn-sm btn-outline-secondary">Back to Cast List</a>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <label class="form-label fw-semibold">Optional Message</label>
          <textarea id="blurb" class="form-control" rows="3"
            placeholder="Add any additional information for your auditionees: rehearsal expectations, required attire, etc."></textarea>
          <div class="form-text">This will appear at the top of the email and printed sheet.</div>
        </div>
      </div>

      <!-- Theme picker -->
      <div class="card mb-3">
        <div class="card-body py-3">
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <span style="font-size:13px;font-weight:600;color:#374151;white-space:nowrap;">Theme Color</span>
            <div id="theme-swatches" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"></div>
            <span style="font-size:12px;color:#9ca3af;" id="theme-label"></span>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap mb-2">
        <button id="send-btn" class="btn btn-dark">Send to All Auditionees (<span id="send-count">…</span>)</button>
        <button id="print-btn" class="btn btn-outline-secondary" onclick="window.print()">Print</button>
        <button id="pdf-btn" class="btn btn-outline-secondary">Download PDF</button>
        <button id="csv-btn" class="btn btn-outline-secondary">Download CSV</button>
      </div>
      <div id="send-result" class="mt-2" style="font-size:13px;"></div>
    </div>

    <!-- Preview (also the print target) -->
    <div class="card" id="preview-card">
      <div class="card-body" id="preview-body" style="padding:0;overflow:hidden;border-radius:8px;">
        <div class="text-muted p-4">Loading preview…</div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const THEMES = [
      { id: 'black',    label: 'Classic',   accent: '#1a1a1a', text: '#ffffff', border: '#1a1a1a' },
      { id: 'navy',     label: 'Navy',      accent: '#1e3a5f', text: '#ffffff', border: '#1e3a5f' },
      { id: 'forest',   label: 'Forest',    accent: '#1a4731', text: '#ffffff', border: '#1a4731' },
      { id: 'burgundy', label: 'Burgundy',  accent: '#7c1d3a', text: '#ffffff', border: '#7c1d3a' },
      { id: 'gold',     label: 'Gold',      accent: '#92650a', text: '#ffffff', border: '#92650a' },
      { id: 'slate',    label: 'Slate',     accent: '#4b5563', text: '#ffffff', border: '#4b5563' },
      { id: 'rose',     label: 'Rose',      accent: '#9f1239', text: '#ffffff', border: '#9f1239' },
    ];

    const STORAGE_BLURB = 'cs_publish_blurb';
    const STORAGE_THEME = 'cs_publish_theme';

    const savedThemeId = localStorage.getItem(STORAGE_THEME) || 'black';
    let activeTheme = THEMES.find(t => t.id === savedThemeId) || THEMES[0];
    let publishData = null;

    // Render theme swatches
    const swatchContainer = document.getElementById('theme-swatches');
    THEMES.forEach(t => {
      const swatch = document.createElement('button');
      swatch.className = 'theme-swatch' + (t.id === activeTheme.id ? ' active' : '');
      swatch.style.background = t.accent;
      swatch.title = t.label;
      swatch.addEventListener('click', () => {
        activeTheme = t;
        localStorage.setItem(STORAGE_THEME, t.id);
        document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        document.getElementById('theme-label').textContent = t.label;
        renderPreview(document.getElementById('blurb').value.trim());
      });
      swatchContainer.appendChild(swatch);
    });
    document.getElementById('theme-label').textContent = activeTheme.label;

    function renderPreview(blurb) {
      if (!publishData) return;
      const { org_name, season_name, pieces } = publishData;
      const t = activeTheme;

      // Header with production name big, org name smaller below
      let html = `<div class="preview-header" style="background:${t.accent};padding:28px 32px 24px;text-align:center;margin-bottom:0;">
        <div style="font-size:22px;font-weight:700;color:${t.text};letter-spacing:-.3px;margin-bottom:6px;">${escapeHtml(season_name)}</div>
        <div style="font-size:13px;color:${t.text};opacity:.75;font-weight:500;text-transform:uppercase;letter-spacing:.8px;">${escapeHtml(org_name)}</div>
      </div>`;

      html += `<div style="padding:24px 32px;">`;

      if (blurb) {
        html += `<div style="border-left:3px solid ${t.accent};padding:8px 14px;color:#333;margin-bottom:24px;font-size:14px;background:#fafafa;border-radius:0 6px 6px 0;">${escapeHtml(blurb).replace(/\n/g,'<br>')}</div>`;
      }

      if (pieces.length === 0) {
        html += '<p class="text-muted">No pieces added to the schedule yet.</p>';
      }

      pieces.forEach((p, i) => {
        const blocks       = p.blocks || [];
        const casts        = p.casts  || [];
        const members      = casts.filter(c => c.cast_role === 'member');
        const understudies = casts.filter(c => c.cast_role === 'understudy');
        const rehearsalStr = blocks.length
          ? blocks.map(b => `${b.day} ${b.start_time}–${b.end_time}`).join(', ')
          : '<em style="color:#aaa;">TBD</em>';

        html += `<div class="piece-block" style="${i > 0 ? `border-top:1px solid #e5e7eb;` : ''}">`;
        html += `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px;">
          <h5 style="margin:0;font-size:15px;font-weight:700;color:${t.accent};">${escapeHtml(p.name)}</h5>
        </div>`;

        if (p.choreographer_name) {
          html += `<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:2px;">${escapeHtml(p.choreographer_name)}</div>`;
          if (p.choreographer_email) html += `<div style="font-size:12px;color:#6b7280;margin-bottom:6px;">${escapeHtml(p.choreographer_email)}</div>`;
        }

        html += `<div style="font-size:12px;color:#6b7280;margin-bottom:10px;">Rehearsals: ${rehearsalStr}</div>`;

        if (members.length === 0 && understudies.length === 0) {
          html += `<p style="font-size:13px;color:#aaa;font-style:italic;">No cast assigned yet.</p>`;
        } else {
          members.forEach(c => {
            const role = c.role_name ? `<span style="color:#9ca3af;font-size:12px;">, ${escapeHtml(c.role_name)}</span>` : '';
            html += `<p class="cast-name">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}${role}</p>`;
          });
          understudies.forEach(c => {
            const role = c.role_name ? `<span style="color:#9ca3af;font-size:12px;">, ${escapeHtml(c.role_name)}</span>` : '';
            html += `<p class="cast-name" style="color:#6b7280;">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}${role} <span style="font-size:12px;font-style:italic;">(understudy)</span></p>`;
          });
        }
        html += `</div>`;
      });

      html += `</div>`;
      document.getElementById('preview-body').innerHTML = html;
    }

    // Restore saved blurb
    const savedBlurb = localStorage.getItem(STORAGE_BLURB) || '';
    if (savedBlurb) document.getElementById('blurb').value = savedBlurb;

    // Live preview update + auto-save as director types blurb
    document.getElementById('blurb').addEventListener('input', function () {
      localStorage.setItem(STORAGE_BLURB, this.value);
      renderPreview(this.value.trim());
    });

    // Send button opens confirmation modal
    document.getElementById('send-btn').addEventListener('click', () => {
      const count = publishData?.auditionee_count ?? 0;
      document.getElementById('confirm-count').textContent =
        `${count} auditionee${count !== 1 ? 's' : ''}`;
      new bootstrap.Modal(document.getElementById('sendConfirmModal')).show();
    });

    // Actual send from modal
    document.getElementById('confirm-send-btn').addEventListener('click', async () => {
      const modal    = bootstrap.Modal.getInstance(document.getElementById('sendConfirmModal'));
      const btn      = document.getElementById('confirm-send-btn');
      const resultEl = document.getElementById('send-result');
      const blurb    = document.getElementById('blurb').value.trim();
      btn.disabled   = true;
      btn.textContent = 'Sending…';
      modal.hide();
      resultEl.textContent = '';
      resultEl.className = '';
      try {
        const res  = await fetch('/api/publish/send', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ blurb }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        resultEl.textContent = `✓ ${data.message}`;
        resultEl.className   = 'text-success';
      } catch (err) {
        resultEl.textContent = `Error: ${err.message}`;
        resultEl.className   = 'text-danger';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Send Now';
      }
    });

    // PDF download
    document.getElementById('pdf-btn').addEventListener('click', async () => {
      const btn = document.getElementById('pdf-btn');
      btn.disabled = true;
      btn.textContent = 'Generating…';
      try {
        const element = document.getElementById('preview-card');
        const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgW = pageW;
        const imgH = (canvas.height * imgW) / canvas.width;
        let y = 0;
        while (y < imgH) {
          const sliceH = Math.min(pageH, imgH - y);
          const srcY = (y / imgH) * canvas.height;
          const srcH = (sliceH / imgH) * canvas.height;
          const slice = document.createElement('canvas');
          slice.width = canvas.width;
          slice.height = srcH;
          slice.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
          if (y > 0) pdf.addPage();
          pdf.addImage(slice.toDataURL('image/png'), 'PNG', 0, 0, pageW, sliceH);
          y += pageH;
        }
        const name = publishData ? `${publishData.season_name.replace(/\s+/g,'_')}_cast_list.pdf` : 'cast_list.pdf';
        pdf.save(name);
      } catch (err) {
        alert('Could not generate PDF: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Download PDF';
      }
    });

    // CSV export
    document.getElementById('csv-btn').addEventListener('click', () => {
      if (!publishData) return;
      const { org_name, season_name, pieces } = publishData;
      const rows = [['Org','Production','Piece','Choreographer','Choreo Email','Rehearsals','First Name','Last Name','Role Name','Cast Role']];
      pieces.forEach(p => {
        const rehearsalStr = (p.blocks||[]).map(b=>`${b.day} ${b.start_time}-${b.end_time}`).join(' | ');
        const casts = p.casts || [];
        if (casts.length === 0) {
          rows.push([org_name, season_name, p.name, p.choreographer_name||'', p.choreographer_email||'', rehearsalStr, '', '', '', '']);
        } else {
          casts.forEach(c => {
            rows.push([org_name, season_name, p.name, p.choreographer_name||'', p.choreographer_email||'', rehearsalStr, c.first_name, c.last_name, c.role_name||'', c.cast_role]);
          });
        }
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `${org_name.replace(/\s+/g,'_')}_casting.csv`;
      a.click();
    });

    // Load data
    async function loadPublishData() {
      try {
        const res  = await fetch('/api/publish');
        publishData = await res.json();
        document.getElementById('subtitle').textContent =
          `${publishData.season_name} · ${publishData.org_name}`;
        document.getElementById('send-count').textContent = publishData.auditionee_count;
        renderPreview(document.getElementById('blurb').value.trim());
      } catch (err) {
        document.getElementById('preview-body').innerHTML = '<div class="p-4 text-danger">Could not load casting data.</div>';
      }
    }

    loadPublishData();
  </script>

  <script>
    (async () => {
      try {
        const res  = await fetch('/api/auth/me');
        const user = await res.json();
        if (!res.ok || (user.role !== 'master' && user.mode !== 'director')) { window.location.href = 'login.html'; return; }
        if (!user.orgId) { window.location.href = 'org-select.html'; return; }
        const nav = document.querySelector('.navbar-nav');
        nav.insertAdjacentHTML('beforeend',
          `<li class="nav-item"><span class="nav-link nav-context">${user.orgName} · ${user.seasonName}</span></li>`
        );
        document.getElementById('right-nav').innerHTML =
          window.renderProductionSwitcher(user) +
          `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
        window.initProductionSwitcher();
        document.getElementById('logout-btn').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = 'login.html';
        });
        document.body.style.visibility = 'visible';
      } catch (err) { window.location.href = 'login.html'; }
    })();
  </script>

  </div>
</body>
</html>
