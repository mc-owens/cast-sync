<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    .attendance-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .attendance-row:last-child { border-bottom: none; }
    .attendance-name { flex: 1; font-size: 14px; }
    .row-saved { font-size: 12px; white-space: nowrap; }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell-staff.js"></script>

  <div class="app-main">
    <div class="container-fluid mt-4 px-4" style="max-width:820px;">

      <div class="mb-3">
        <h5 class="mb-0 fw-semibold">Attendance</h5>
        <p class="text-muted mb-0" style="font-size:13px;">Track who showed up to rehearsal, for the pieces you're assigned to.</p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
        <select id="piece-select" class="form-select form-select-sm" style="width:220px;"></select>
        <div style="display:flex;gap:0;border:1px solid #dee2e6;border-radius:6px;overflow:hidden;">
          <button id="tab-log-btn" class="btn btn-sm" style="border-radius:0;border:none;padding:4px 14px;font-size:13px;background:#111827;color:#fff;font-weight:600;">Log</button>
          <button id="tab-logs-btn" class="btn btn-sm" style="border-radius:0;border:none;padding:4px 14px;font-size:13px;background:transparent;color:#374151;">History</button>
        </div>
      </div>

      <!-- Log tab -->
      <div id="log-tab">
        <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
          <button id="prev-day-btn" class="btn btn-sm btn-outline-secondary">&lsaquo;</button>
          <input type="date" id="attendance-date" class="form-control form-control-sm" style="width:160px;">
          <button id="next-day-btn" class="btn btn-sm btn-outline-secondary">&rsaquo;</button>
          <button id="today-btn" class="btn btn-sm btn-outline-secondary">Today</button>
        </div>
        <div id="mismatch-warning" class="alert alert-warning py-2 px-3 mb-2 d-none" style="font-size:13px;"></div>
        <div id="attendance-count" style="display:none;font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;"></div>
        <div id="attendance-loading" class="text-muted" style="font-size:14px;">Loading…</div>
        <div id="attendance-list"></div>
        <div id="log-save-wrap" style="display:none;margin-top:16px;">
          <button id="log-save-btn" class="btn btn-dark btn-sm px-4">Log Attendance</button>
          <span id="log-saved-msg" style="display:none;font-size:13px;color:#16a34a;margin-left:10px;">Saved.</span>
        </div>
      </div>

      <!-- Logs tab -->
      <div id="logs-tab" style="display:none;">
        <div id="logs-loading" class="text-muted" style="font-size:14px;">Loading…</div>
        <div id="logs-list"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const STATUS_LABELS = { none: 'None', injured: 'Injured', illness: 'Illness', other: 'Other' };

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function shiftDate(dateStr, days) {
      const d = new Date(`${dateStr}T00:00:00`);
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    const dateInput   = document.getElementById('attendance-date');
    const pieceSelect = document.getElementById('piece-select');
    dateInput.value = todayStr();

    async function loadPieces() {
      try {
        const res = await fetch('/api/staff/pieces');
        if (!res.ok) return false;
        const pieces = await res.json();
        if (pieces.length === 0) {
          pieceSelect.innerHTML = '<option value="">No pieces yet</option>';
          return false;
        }
        const params = new URLSearchParams(window.location.search);
        const wantedId = params.get('piece') ? parseInt(params.get('piece')) : null;
        const defaultPiece = (wantedId && pieces.find(p => p.piece_id === wantedId)) || pieces[0];

        pieceSelect.innerHTML = pieces.map(p =>
          `<option value="${p.piece_id}" ${p.piece_id === defaultPiece.piece_id ? 'selected' : ''}>${escapeHtml(p.piece_name)} (${escapeHtml(p.season_name)})</option>`
        ).join('');
        return true;
      } catch (e) { return false; }
    }

    function renderRow(d) {
      const row = document.createElement('div');
      row.className = 'attendance-row';
      row.dataset.userId = d.user_id;
      row.innerHTML = `
        <div class="attendance-name">${escapeHtml(d.first_name)} ${escapeHtml(d.last_name)}</div>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input present-toggle" type="checkbox" role="switch" ${d.present ? 'checked' : ''}>
          <label class="form-check-label present-label" style="font-size:13px;width:58px;display:inline-block;">${d.present ? 'Present' : 'Absent'}</label>
        </div>
        <select class="form-select form-select-sm status-select" style="width:110px;">
          ${Object.entries(STATUS_LABELS).map(([val, label]) => `<option value="${val}" ${d.status === val ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
        <input type="text" class="form-control form-control-sm other-note ${d.status === 'other' ? '' : 'd-none'}"
               style="width:170px;" placeholder="Specify…" value="${escapeHtml(d.status_note || '')}">
        <span class="row-saved text-success d-none">Saved</span>
      `;
      return row;
    }

    async function saveRow(row) {
      const userId     = row.dataset.userId;
      const present    = row.querySelector('.present-toggle').checked;
      const status     = row.querySelector('.status-select').value;
      const statusNote = row.querySelector('.other-note').value.trim();
      const savedEl    = row.querySelector('.row-saved');
      try {
        const res = await fetch(`/api/staff/pieces/${pieceSelect.value}/attendance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: dateInput.value, user_id: parseInt(userId), present, status, status_note: statusNote }),
        });
        if (!res.ok) { alert('Could not save attendance for this dancer.'); return; }
        savedEl.classList.remove('d-none');
        setTimeout(() => savedEl.classList.add('d-none'), 1500);
      } catch (err) {
        alert('Could not connect to server.');
      }
    }

    function updateCount() {
      const rows = document.querySelectorAll('#attendance-list .attendance-row');
      if (rows.length === 0) { document.getElementById('attendance-count').style.display = 'none'; return; }
      const present = [...rows].filter(r => r.querySelector('.present-toggle')?.checked).length;
      document.getElementById('attendance-count').textContent = `${present}/${rows.length} present`;
      document.getElementById('attendance-count').style.display = '';
    }

    document.getElementById('attendance-list').addEventListener('change', (e) => {
      const row = e.target.closest('.attendance-row');
      if (!row) return;
      if (e.target.classList.contains('present-toggle')) {
        row.querySelector('.present-label').textContent = e.target.checked ? 'Present' : 'Absent';
        updateCount();
      }
      if (e.target.classList.contains('status-select')) {
        row.querySelector('.other-note').classList.toggle('d-none', e.target.value !== 'other');
      }
      saveRow(row);
    });

    document.getElementById('attendance-list').addEventListener('blur', (e) => {
      if (!e.target.classList.contains('other-note')) return;
      const row = e.target.closest('.attendance-row');
      if (row) saveRow(row);
    }, true);

    async function loadAttendance() {
      const date    = dateInput.value;
      const pieceId = pieceSelect.value;
      if (!pieceId) { document.getElementById('attendance-loading').textContent = 'No pieces yet.'; return; }
      document.getElementById('attendance-loading').style.display = '';
      document.getElementById('attendance-loading').textContent = 'Loading…';
      document.getElementById('attendance-list').innerHTML = '';
      document.getElementById('attendance-count').style.display = 'none';
      try {
        const res = await fetch(`/api/staff/pieces/${pieceId}/attendance?date=${encodeURIComponent(date)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('attendance-loading').style.display = 'none';

        if (data.start_date) dateInput.min = data.start_date;
        if (data.end_date)   dateInput.max = data.end_date;

        const warningEl = document.getElementById('mismatch-warning');
        if (data.rehearses_this_day === false) {
          warningEl.innerHTML = `<strong>${escapeHtml(data.piece_name || 'This piece')}</strong> doesn't usually rehearse on ${escapeHtml(data.day_of_week)}s. Is this a one-time rehearsal? Proceed if yes, or select the correct date for your log.`;
          warningEl.classList.remove('d-none');
        } else {
          warningEl.classList.add('d-none');
        }

        const list = document.getElementById('attendance-list');
        if (data.dancers.length === 0) {
          list.innerHTML = '<p class="text-muted" style="font-size:13px;">No one is cast in this piece yet.</p>';
          return;
        }
        data.dancers.forEach(d => list.appendChild(renderRow(d)));
        updateCount();
        document.getElementById('log-save-wrap').style.display = data.dancers.length > 0 ? '' : 'none';
      } catch (err) {
        document.getElementById('attendance-loading').textContent = 'Could not load attendance.';
      }
    }

    document.getElementById('prev-day-btn').addEventListener('click', () => { dateInput.value = shiftDate(dateInput.value, -1); loadAttendance(); });
    document.getElementById('next-day-btn').addEventListener('click', () => { dateInput.value = shiftDate(dateInput.value, 1); loadAttendance(); });
    document.getElementById('today-btn').addEventListener('click', () => { dateInput.value = todayStr(); loadAttendance(); });
    dateInput.addEventListener('change', loadAttendance);
    pieceSelect.addEventListener('change', () => {
      if (activeTab === 'log') loadAttendance();
      else loadLogs();
    });

    let activeTab = 'log';
    function showTab(tab) {
      activeTab = tab;
      document.getElementById('log-tab').style.display  = tab === 'log'  ? '' : 'none';
      document.getElementById('logs-tab').style.display = tab === 'logs' ? '' : 'none';
      document.getElementById('tab-log-btn').style.background  = tab === 'log'  ? '#111827' : 'transparent';
      document.getElementById('tab-log-btn').style.color       = tab === 'log'  ? '#fff' : '#374151';
      document.getElementById('tab-log-btn').style.fontWeight  = tab === 'log'  ? '600' : '400';
      document.getElementById('tab-logs-btn').style.background = tab === 'logs' ? '#111827' : 'transparent';
      document.getElementById('tab-logs-btn').style.color      = tab === 'logs' ? '#fff' : '#374151';
      document.getElementById('tab-logs-btn').style.fontWeight = tab === 'logs' ? '600' : '400';
      if (tab === 'logs') loadLogs();
    }
    document.getElementById('tab-log-btn').addEventListener('click',  () => showTab('log'));
    document.getElementById('tab-logs-btn').addEventListener('click', () => showTab('logs'));

    document.getElementById('log-save-btn').addEventListener('click', async () => {
      const rows = document.querySelectorAll('#attendance-list .attendance-row');
      if (rows.length === 0) return;
      const btn = document.getElementById('log-save-btn');
      btn.disabled = true; btn.textContent = 'Saving...';
      let ok = true;
      for (const row of rows) {
        try {
          const r = await fetch(`/api/staff/pieces/${pieceSelect.value}/attendance`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: dateInput.value, user_id: parseInt(row.dataset.userId), present: row.querySelector('.present-toggle').checked, status: row.querySelector('.status-select').value, status_note: row.querySelector('.other-note').value.trim() }),
          });
          if (!r.ok) ok = false;
        } catch (_) { ok = false; }
      }
      btn.disabled = false; btn.textContent = 'Log Attendance';
      const msg = document.getElementById('log-saved-msg');
      msg.textContent = ok ? 'Saved.' : 'Some records could not be saved.';
      msg.style.color = ok ? '#16a34a' : '#dc2626';
      msg.style.display = '';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    });

    async function loadLogs() {
      const pieceId = pieceSelect.value;
      if (!pieceId) return;
      const logsEl = document.getElementById('logs-list');
      document.getElementById('logs-loading').style.display = '';
      logsEl.innerHTML = '';
      try {
        const res = await fetch(`/api/staff/pieces/${pieceId}/attendance/history`);
        if (!res.ok) throw new Error();
        const logs = await res.json();
        document.getElementById('logs-loading').style.display = 'none';
        if (logs.length === 0) { logsEl.innerHTML = '<p class="text-muted" style="font-size:13px;">No attendance logged yet.</p>'; return; }
        logsEl.innerHTML = logs.map(log => {
          const dateLabel = new Date(log.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          const rows = log.dancers.map(d =>
            `<div style="display:flex;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid #f9fafb;">
               <span style="flex:1;">${escapeHtml(d.first_name)} ${escapeHtml(d.last_name)}</span>
               <span style="font-weight:${d.present ? '600' : '400'};color:${d.present ? '#16a34a' : '#dc2626'};">${d.present ? 'Present' : 'Absent'}</span>
             </div>`
          ).join('');
          return `<div style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;overflow:hidden;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f9fafb;cursor:pointer;" class="log-header">
              <span style="font-weight:600;font-size:14px;">${dateLabel}</span>
              <span style="font-size:13px;color:#6b7280;">${log.present_count}/${log.total} present</span>
            </div>
            <div class="log-rows" style="padding:0 14px;display:none;">${rows}</div>
          </div>`;
        }).join('');
        logsEl.addEventListener('click', e => {
          const h = e.target.closest('.log-header');
          if (h) h.nextElementSibling.style.display = h.nextElementSibling.style.display === 'none' ? '' : 'none';
        }, { once: false });
      } catch (_) { document.getElementById('logs-loading').textContent = 'Could not load logs.'; }
    }
  </script>

  <script>
    (async () => {
      try {
        const res  = await fetch('/api/auth/me');
        const user = await res.json();
        if (!res.ok || (!user.isStaff && user.role !== 'staff')) { window.location.href = 'login.html'; return; }
        document.getElementById('right-nav').innerHTML =
          `<a href="account.html">Account</a>` +
          (user.isDirector ? `<button id="switch-director-btn">Switch to Director</button>` : '') +
          `<button id="switch-auditionee-btn">Switch to Auditionee</button>
           <button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
        if (user.isDirector) {
          document.getElementById('switch-director-btn').addEventListener('click', async () => {
            await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'director' }) });
            window.location.href = 'org-select.html';
          });
        }
        document.getElementById('switch-auditionee-btn').addEventListener('click', async () => {
          await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'auditionee' }) });
          window.location.href = 'auditionForm.html';
        });
        document.getElementById('logout-btn').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = 'login.html';
        });
        document.body.style.visibility = 'visible';

        const hasPieces = await loadPieces();
        if (hasPieces) {
          loadAttendance();
        } else {
          document.getElementById('attendance-loading').textContent = "You haven't been assigned to any pieces yet.";
        }
      } catch (err) {
        window.location.href = 'login.html';
      }
    })();
  </script>

  </div>
</body>
</html>
