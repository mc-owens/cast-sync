<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Audition Day Live | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body { background: #fffdf7; }

    /* ── Top strips ── */
    #day-header {
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
      padding: 10px 16px 0;
    }
    #day-title { font-size: 15px; font-weight: 700; color: #2d2512; }
    #day-date  { font-size: 12px; color: #aaa; margin-left: 8px; }

    /* ── Combo tabs ── */
    #combo-tabbar {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #combo-tabbar::-webkit-scrollbar { display: none; }
    .combo-tab {
      flex-shrink: 0;
      padding: 5px 14px;
      border-radius: 20px 20px 0 0;
      border: 1px solid #e8dfc8;
      border-bottom: none;
      background: #f5f0e8;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
    }
    .combo-tab.active { background: #fff; color: #2d2512; }
    #add-combo-btn {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px dashed #c9a84c;
      background: transparent;
      font-size: 12px;
      color: #c9a84c;
      cursor: pointer;
      align-self: center;
      margin-bottom: 4px;
      margin-left: 4px;
    }

    /* ── Main tabs ── */
    #main-tabs {
      display: flex;
      border-bottom: 2px solid #e8dfc8;
      background: #fff;
      padding: 0 16px;
    }
    .main-tab {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
    }
    .main-tab.active { color: #2d2512; border-bottom-color: #c9a84c; }

    /* ── Observe controls bar ── */
    #observe-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
      flex-wrap: wrap;
    }
    #piece-select {
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #e8dfc8;
      border-radius: 6px;
      padding: 4px 10px;
      background: #fffdf7;
      color: #2d2512;
      max-width: 220px;
    }
    #group-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      white-space: nowrap;
    }
    .group-nav-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid #e8dfc8;
      background: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .group-nav-btn:disabled { opacity: .35; cursor: default; }

    /* ── Dancer cards ── */
    #dancer-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 10px 12px;
    }
    .dancer-card {
      background: #fff;
      border: 1px solid #e8dfc8;
      border-left: 3px solid #e8dfc8;
      border-radius: 8px;
      padding: 8px 10px;
      transition: border-left-color .1s;
    }
    .dancer-card.has-hp  { border-left-color: #c9a84c; }
    .dancer-card.has-p   { border-left-color: rgba(201,168,76,.45); }
    .dancer-card.has-note { background: #faf8f2; }

    .dancer-name {
      font-size: 12px;
      font-weight: 600;
      color: #2d2512;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dancer-num { color: #aaa; font-weight: 400; margin-right: 3px; }

    .obs-btns { display: flex; gap: 5px; align-items: center; }
    .obs-btn {
      padding: 3px 10px;
      border-radius: 6px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #888;
      transition: all .1s;
    }
    .obs-btn.active-p  { background: rgba(201,168,76,.15); border-color: #c9a84c; color: #8a6820; }
    .obs-btn.active-hp { background: #c9a84c; border-color: #b8973d; color: #fff; }

    .note-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #bbb;
      padding: 2px 3px;
      margin-left: 2px;
    }
    .note-btn.has-note { color: #c9a84c; }

    .quick-cb-btn {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 3px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      cursor: pointer;
      text-align: center;
    }
    .quick-cb-btn.active { background: rgba(201,168,76,.12); border-color: #c9a84c; color: #8a6820; }

    .prior-context {
      font-size: 10px;
      color: #aaa;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prior-context span { margin-right: 8px; }
    .prior-hp { color: #b8973d; font-weight: 600; }
    .prior-p  { color: #a08030; }

    .note-field {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      border: 1px solid #e8dfc8;
      border-radius: 6px;
      padding: 6px 8px;
      background: #fffdf7;
      resize: vertical;
      min-height: 52px;
      font-family: inherit;
    }

    /* ── Callback panel ── */
    #cb-group-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 8px;
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
      flex-wrap: wrap;
    }
    #cb-group-label { font-size: 13px; font-weight: 600; color: #2d2512; }
    #cb-group-info { font-size: 11px; color: #aaa; }
    #callback-content { padding: 12px 16px; }
    .cb-toggle {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      flex-shrink: 0;
    }
    .cb-toggle.active { background: #c9a84c; border-color: #b8973d; color: #fff; }

    /* ── Review panel ── */
    #panel-review { padding: 12px 16px; }
    .review-card {
      background: #fff;
      border: 1px solid #e8dfc8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .review-dancer-name { font-size: 14px; font-weight: 700; color: #2d2512; margin-bottom: 8px; }
    .review-obs-row { font-size: 12px; color: #555; margin-bottom: 4px; }
    .review-obs-piece { font-weight: 600; color: #2d2512; }
    .review-combo-item { display: inline-block; margin-right: 10px; }
    .review-note { font-size: 12px; color: #777; font-style: italic; margin: 6px 0; padding: 6px 8px; background: #faf8f2; border-radius: 5px; border-left: 2px solid #c9a84c; }
    .review-final-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0ede5; }
    .review-final-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; margin-bottom: 6px; }
    .final-piece-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .final-piece-name { font-size: 12px; color: #555; flex: 1; }
    .final-btns { display: flex; gap: 6px; }
    .final-btn {
      padding: 3px 10px;
      border-radius: 5px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #888;
    }
    .final-btn.active-p  { background: rgba(201,168,76,.15); border-color: #c9a84c; color: #8a6820; }
    .final-btn.active-hp { background: #c9a84c; border-color: #b8973d; color: #fff; }
    .final-btn.active-nc { background: #f3f4f6; border-color: #9ca3af; color: #555; }

    /* ── Callback dancer grid (same as #dancer-list) ── */
    .dancer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 4px 0;
    }

    /* ── Callback group nav buttons ── */
    .nav-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid #e8dfc8;
      background: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:disabled { opacity: .35; cursor: default; }

    /* ── Add combo modal ── */
    .modal-content { border-radius: 12px; }

    /* ── Final Review button ── */
    #final-review-btn {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1.5px solid #c9a84c;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #8a6820;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #final-review-btn.active {
      background: #c9a84c;
      color: #fff;
    }

    /* ── Called Back badge ── */
    .cb-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #8a6820;
      background: rgba(201,168,76,.15);
      border: 1px solid #c9a84c;
      border-radius: 12px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* ── Empty states ── */
    .empty-msg { color: #aaa; font-size: 13px; padding: 20px 0; text-align: center; }

    /* ── Mobile layout ── */
    @media (max-width: 600px) {
      /* Single-column dancer grids */
      #dancer-list {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 8px 10px;
      }

      .dancer-grid {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      /* Bigger tap targets for observe buttons */
      .obs-btn {
        padding: 8px 16px;
        font-size: 12px;
      }

      .note-btn {
        padding: 6px 8px;
        font-size: 15px;
      }

      .quick-cb-btn {
        padding: 8px 0;
        font-size: 12px;
        margin-top: 8px;
      }

      /* Bigger group nav buttons */
      .group-nav-btn,
      .nav-btn {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }

      /* Final consideration: stack piece name above buttons */
      .final-piece-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .final-piece-name {
        font-weight: 600;
      }

      .final-btns {
        flex-wrap: wrap;
        gap: 5px;
      }

      .final-btn {
        padding: 6px 12px;
        font-size: 12px;
      }

      /* Review padding */
      #panel-review {
        padding: 8px 10px;
      }

      /* Callback panel padding */
      #callback-content {
        padding: 8px 10px;
      }

      /* Observe controls: piece selector full width on mobile */
      #piece-select {
        max-width: 100%;
        flex: 1;
      }

      /* Header: prevent long titles from overflowing */
      #day-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      #day-date {
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Day header row: let title shrink */
      #day-header .d-flex {
        min-width: 0;
      }
    }
  </style>
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell.js"></script>

  <div class="app-main" style="padding-left:0;padding-right:0;max-width:680px;margin:0 auto;">

    <!-- Day header + combo tabs + main tabs -->
    <div id="day-header">
      <div class="d-flex align-items-center mb-1">
        <a href="audition-day.html" style="color:#aaa;font-size:13px;margin-right:12px;text-decoration:none;flex-shrink:0;">← Back</a>
        <span id="day-title"></span>
        <span id="day-date"></span>
        <button id="final-review-btn">Final Review</button>
      </div>
      <div id="combo-tabbar">
        <!-- filled by renderComboTabs() -->
      </div>
    </div>

    <div id="main-tabs">
      <button class="main-tab active" data-tab="observe">Observe</button>
      <button class="main-tab" data-tab="callbacks">Callbacks</button>
    </div>

    <!-- ── Observe panel ── -->
    <div id="panel-observe">
      <div id="observe-controls">
        <div class="d-flex align-items-center gap-2">
          <span style="font-size:12px;color:#888;white-space:nowrap;">For:</span>
          <select id="piece-select" class="form-select form-select-sm" style="max-width:220px;font-weight:600;"></select>
        </div>
        <div id="group-nav">
          <button class="group-nav-btn" id="prev-group">‹</button>
          <span id="group-label" style="font-size:13px;"></span>
          <button class="group-nav-btn" id="next-group">›</button>
        </div>
      </div>
      <div id="dancer-list"></div>
    </div>

    <!-- ── Callbacks panel ── -->
    <div id="panel-callbacks" style="display:none;">
      <div id="cb-group-nav" style="display:none;">
        <button id="cb-prev-group" class="nav-btn" disabled>&#8592;</button>
        <span id="cb-group-label">Group 1 of 1</span>
        <button id="cb-next-group" class="nav-btn">&#8594;</button>
        <span id="cb-group-info"></span>
        <label style="font-size:11px;color:#aaa;display:flex;align-items:center;gap:4px;margin-left:auto;white-space:nowrap;">
          per group
          <input id="cb-gs-input" type="number" min="1" max="500"
            style="width:48px;font-size:12px;padding:2px 5px;border:1px solid #e8dfc8;border-radius:5px;text-align:center;background:#fffdf7;color:#2d2512;">
        </label>
      </div>
      <div id="callback-content"></div>
    </div>

    <!-- ── Review & Finalize panel ── -->
    <div id="panel-review" style="display:none;">
      <div id="review-content"><p class="empty-msg">Switch to this tab to load your review.</p></div>
    </div>

  </div>

  <!-- Add Combo modal -->
  <div class="modal fade" id="addComboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:15px;">Add Combo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Name</label>
            <input type="text" id="new-combo-name" class="form-control form-control-sm" maxlength="60" autocomplete="off">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Group Size</label>
              <input type="number" id="new-combo-gs" class="form-control form-control-sm" min="1" max="200">
            </div>
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Sort By</label>
              <select id="new-combo-sort" class="form-select form-select-sm">
                <option value="number">Audition #</option>
                <option value="last_name">Last Name</option>
                <option value="first_name">First Name</option>
              </select>
            </div>
          </div>
          <div id="combo-preview" style="font-size:12px;color:#8a6820;margin-top:8px;min-height:16px;"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="save-combo-btn">Add Combo</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Piece confirmation modal: required, non-dismissible -->
  <div class="modal fade" id="pieceConfirmModal" tabindex="-1"
       data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:360px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-1">
          <div>
            <h5 class="modal-title fw-semibold mb-1" style="font-size:15px;">Which piece are you observing for?</h5>
            <p style="font-size:12.5px;color:#9ca3af;margin:0;">Your P/HP ratings will be saved under this piece. You can change it anytime from the Observe tab.</p>
          </div>
        </div>
        <div class="modal-body pt-3 pb-2">
          <div id="piece-confirm-list"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-dark w-100" id="piece-confirm-btn" disabled>Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="help-content.js"></script>
  <script>
  (async () => {
    // ── Auth ──────────────────────────────────────────────────────────────────
    const authRes  = await fetch('/api/auth/me');
    const authUser = await authRes.json();
    if (!authRes.ok || (authUser.mode !== 'director' && authUser.role !== 'master')) {
      window.location.href = 'login.html'; return;
    }
    document.getElementById('right-nav').innerHTML =
      `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    // ── Load ─────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const dayId  = params.get('id');
    if (!dayId) { window.location.href = 'audition-day.html'; return; }

    const res  = await fetch(`/api/audition-days/${dayId}`);
    if (!res.ok) { alert('Could not load audition day.'); window.location.href = 'audition-day.html'; return; }
    const data = await res.json();

    // ── State ────────────────────────────────────────────────────────────────
    let allCombos    = data.combos;
    let allDancers   = data.dancers;
    let allPieces    = data.pieces;
    let myObs        = data.myObservations;        // { comboId: { subId: { pieceId: level } } }
    let myNotes      = data.myNotes;               // { subId: body }
    let myFinal      = data.myFinalConsiderations; // { subId: { pieceId: level } }
    let cbRounds     = data.callbackRounds;        // [{ id, name, callbacks: [...] }]

    let activeComboId  = allCombos[0]?.id ?? null;
    let activePieceId  = (allPieces.find(p => p.is_mine) || allPieces[0])?.id ?? null;
    let activeTab      = 'observe';
    let activeGroupIdx = 0;
    let cbGroupIdx     = 0;
    let cbPollTimer    = null;
    let noteTimers     = {};

    // ── Header ───────────────────────────────────────────────────────────────
    document.getElementById('day-title').textContent = data.day.name;
    if (data.day.audition_date) {
      const d = new Date(data.day.audition_date + 'T12:00:00');
      document.getElementById('day-date').textContent =
        ' · ' + d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    }
    document.body.style.visibility = 'visible';

    // ── Helpers ───────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function currentCombo() { return allCombos.find(c => c.id === activeComboId) || allCombos[0]; }

    function sortedDancers() {
      const combo = currentCombo();
      if (!combo) return [];
      return [...allDancers].sort((a, b) => {
        if (combo.sort_order === 'number') {
          const an = a.audition_number != null ? Number(a.audition_number) : Infinity;
          const bn = b.audition_number != null ? Number(b.audition_number) : Infinity;
          if (an !== bn) return an - bn;
        } else if (combo.sort_order === 'last_name') {
          const lc = (a.last_name || '').localeCompare(b.last_name || '');
          if (lc !== 0) return lc;
        } else {
          const fc = (a.first_name || '').localeCompare(b.first_name || '');
          if (fc !== 0) return fc;
        }
        return (a.last_name || '').localeCompare(b.last_name || '');
      });
    }

    function groupDancers() {
      const combo = currentCombo();
      const gs    = combo?.group_size || 8;
      const all   = sortedDancers();
      const start = activeGroupIdx * gs;
      return all.slice(start, start + gs);
    }

    function totalGroups() {
      const combo = currentCombo();
      const gs    = combo?.group_size || 8;
      return Math.ceil(allDancers.length / gs) || 1;
    }

    function getObs(comboId, subId, pieceId) {
      return myObs[String(comboId)]?.[String(subId)]?.[String(pieceId)] || null;
    }

    function priorContext(subId, pieceId) {
      const results = [];
      for (const combo of allCombos) {
        if (combo.id === activeComboId) continue;
        const level = getObs(combo.id, subId, pieceId);
        if (level) results.push({ combo, level });
      }
      return results;
    }

    function levelLabel(level) {
      return level === 'high_priority' ? 'HP' : 'P';
    }

    // ── Combo tabs ───────────────────────────────────────────────────────────
    function renderComboTabs() {
      const bar = document.getElementById('combo-tabbar');
      bar.innerHTML = '';
      allCombos.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'combo-tab' + (c.id === activeComboId ? ' active' : '');
        btn.textContent = c.name;
        btn.addEventListener('click', () => {
          activeComboId  = c.id;
          activeGroupIdx = 0;
          cbGroupIdx     = 0;
          renderComboTabs();
          renderGroupNav();
          renderDancerList();
          updateQuickCbButtons();
          if (activeTab === 'callbacks') renderCallbackTab();
        });
        bar.appendChild(btn);
      });
      const addBtn = document.createElement('button');
      addBtn.id = 'add-combo-btn';
      addBtn.textContent = '+ Combo';
      addBtn.addEventListener('click', openAddComboModal);
      bar.appendChild(addBtn);
    }

    // ── Group nav ────────────────────────────────────────────────────────────
    function renderGroupNav() {
      const total = totalGroups();
      document.getElementById('group-label').textContent =
        `Group ${activeGroupIdx + 1} of ${total}`;
      document.getElementById('prev-group').disabled = activeGroupIdx === 0;
      document.getElementById('next-group').disabled = activeGroupIdx >= total - 1;
    }

    document.getElementById('prev-group').addEventListener('click', () => {
      if (activeGroupIdx > 0) { activeGroupIdx--; renderGroupNav(); renderDancerList(); }
    });
    document.getElementById('next-group').addEventListener('click', () => {
      if (activeGroupIdx < totalGroups() - 1) { activeGroupIdx++; renderGroupNav(); renderDancerList(); }
    });

    // ── Piece selector ───────────────────────────────────────────────────────
    function buildPieceSelector() {
      const sel = document.getElementById('piece-select');
      sel.innerHTML = '';
      const myPieces    = allPieces.filter(p => p.is_mine);
      const otherPieces = allPieces.filter(p => !p.is_mine);

      if (myPieces.length && otherPieces.length) {
        const g1 = document.createElement('optgroup');
        g1.label = 'Your Pieces';
        myPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; g1.appendChild(o); });
        sel.appendChild(g1);
        const g2 = document.createElement('optgroup');
        g2.label = 'Other Pieces';
        otherPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; g2.appendChild(o); });
        sel.appendChild(g2);
      } else {
        allPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
      }

      if (activePieceId) sel.value = String(activePieceId);
      sel.addEventListener('change', () => {
        activePieceId = parseInt(sel.value);
        renderDancerList();
      });
    }

    // ── Dancer list ───────────────────────────────────────────────────────────
    function renderDancerList() {
      const list    = document.getElementById('dancer-list');
      const dancers = groupDancers();

      if (!activePieceId) {
        list.innerHTML = '<p class="empty-msg">Select a piece above to start rating.</p>';
        return;
      }
      if (!dancers.length) {
        list.innerHTML = '<p class="empty-msg">No dancers yet. Add auditionees from the Auditionees page.</p>';
        return;
      }

      list.innerHTML = '';
      dancers.forEach(d => renderDancerCard(list, d));
    }

    function renderDancerCard(container, d) {
      const sid      = String(d.submission_id);
      const pid      = String(activePieceId);
      const cid      = String(activeComboId);
      const level    = getObs(activeComboId, sid, pid);
      const note     = myNotes[sid] || '';
      const prior    = priorContext(sid, pid);
      const hasNote  = !!note;
      const activeRound = activeCallbackRound();
      const isCb    = !!(activeRound?.callbacks || []).find(c => String(c.submission_id) === sid);

      const card = document.createElement('div');
      card.className = 'dancer-card' +
        (level === 'high_priority' ? ' has-hp' : level === 'priority' ? ' has-p' : '') +
        (hasNote ? ' has-note' : '');
      card.dataset.sid = sid;

      const numStr  = d.audition_number != null ? `<span class="dancer-num">#${d.audition_number}</span>` : '';
      const nameStr = `${escHtml(d.first_name)} ${escHtml(d.last_name)}`;

      // Prior context line
      let priorHtml = '';
      if (prior.length) {
        const parts = prior.map(r => {
          const cls = r.level === 'high_priority' ? 'prior-hp' : 'prior-p';
          return `<span><span class="text-muted">${escHtml(r.combo.name)}:</span> <span class="${cls}">${levelLabel(r.level)}</span></span>`;
        });
        priorHtml = `<div class="prior-context">${parts.join('')}</div>`;
      }

      // Note textarea (hidden unless has note or user opens it)
      const noteId  = `note-${sid}`;
      const noteHtml = `<textarea id="${noteId}" class="note-field" placeholder="Add a note…" rows="2">${escHtml(note)}</textarea>`;

      const cbLabel = isCb ? '✓ Called Back' : '+ Callback';

      card.innerHTML = `
        <div class="dancer-name">${numStr}${nameStr}</div>
        <div class="obs-btns">
          <button class="obs-btn${level === 'priority' ? ' active-p' : ''}" data-level="priority">P</button>
          <button class="obs-btn${level === 'high_priority' ? ' active-hp' : ''}" data-level="high_priority">HP</button>
          <button class="note-btn${hasNote ? ' has-note' : ''}" data-note-toggle="${sid}" title="Note">✏</button>
        </div>
        <button class="quick-cb-btn${isCb ? ' active' : ''}" data-sid="${sid}">${cbLabel}</button>
        ${priorHtml}
        <div id="note-area-${sid}" style="display:${hasNote ? '' : 'none'};">${noteHtml}</div>
      `;

      // P / HP tap
      card.querySelectorAll('.obs-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleObs(d.submission_id, btn.dataset.level, card));
      });

      // Note toggle
      card.querySelector(`[data-note-toggle="${sid}"]`)?.addEventListener('click', () => {
        const area = document.getElementById(`note-area-${sid}`);
        area.style.display = area.style.display === 'none' ? '' : 'none';
        if (area.style.display !== 'none') area.querySelector('textarea').focus();
      });

      // Note autosave
      const ta = card.querySelector(`#${noteId}`);
      ta.addEventListener('input', () => {
        clearTimeout(noteTimers[sid]);
        noteTimers[sid] = setTimeout(() => saveNote(d.submission_id, ta.value), 1200);
      });

      // Quick callback toggle
      card.querySelector('.quick-cb-btn')?.addEventListener('click', () =>
        toggleCallbackFromObserve(d.submission_id)
      );

      container.appendChild(card);
    }

    async function toggleObs(submissionId, level, card) {
      const sid  = String(submissionId);
      const pid  = String(activePieceId);
      const cid  = String(activeComboId);
      const cur  = getObs(activeComboId, sid, pid);
      const next = cur === level ? null : level;

      // Update local state
      if (!myObs[cid]) myObs[cid] = {};
      if (!myObs[cid][sid]) myObs[cid][sid] = {};
      if (next) myObs[cid][sid][pid] = next;
      else delete myObs[cid][sid][pid];

      // Update card UI without full re-render
      card.querySelectorAll('.obs-btn').forEach(btn => {
        btn.className = 'obs-btn' +
          (btn.dataset.level === 'priority' && next === 'priority' ? ' active-p' : '') +
          (btn.dataset.level === 'high_priority' && next === 'high_priority' ? ' active-hp' : '');
      });
      card.className = 'dancer-card' +
        (next === 'high_priority' ? ' has-hp' : next === 'priority' ? ' has-p' : '') +
        (card.classList.contains('has-note') ? ' has-note' : '');

      await fetch(`/api/audition-days/${dayId}/observations`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ combo_id: activeComboId, submission_id: submissionId, piece_id: activePieceId, level: next }),
      }).catch(() => {});
    }

    async function saveNote(submissionId, body) {
      const sid = String(submissionId);
      const trimmed = body.trim();
      if (trimmed) myNotes[sid] = trimmed; else delete myNotes[sid];

      // Update note button icon
      const btn = document.querySelector(`[data-note-toggle="${sid}"]`);
      if (btn) btn.className = 'note-btn' + (trimmed ? ' has-note' : '');
      // Update card style
      const card = document.querySelector(`.dancer-card[data-sid="${sid}"]`);
      if (card) {
        if (trimmed) card.classList.add('has-note'); else card.classList.remove('has-note');
      }

      await fetch(`/api/audition-days/${dayId}/notes/${submissionId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body }),
      }).catch(() => {});
    }

    // ── Callback rounds ────────────────────────────────────────────────────────

    function activeCallbackRound() {
      return cbRounds.find(r => r.combo_id !== null && String(r.combo_id) === String(activeComboId)) || null;
    }

    function cbDancers() {
      const round = activeCallbackRound();
      if (!round || !round.callbacks.length) return [];
      const cbSet = new Set(round.callbacks.map(c => String(c.submission_id)));
      return sortedDancers().filter(d => cbSet.has(String(d.submission_id)));
    }

    function cbTotalGroups() {
      const round = activeCallbackRound();
      const gs = round?.group_size || 8;
      return Math.ceil(cbDancers().length / gs) || 1;
    }

    function cbGroupDancers() {
      const round = activeCallbackRound();
      const gs = round?.group_size || 8;
      const start = cbGroupIdx * gs;
      return cbDancers().slice(start, start + gs);
    }

    function renderCallbackTab() {
      const round   = activeCallbackRound();
      const content = document.getElementById('callback-content');
      const nav     = document.getElementById('cb-group-nav');
      const combo   = currentCombo();

      if (!round || !round.callbacks.length) {
        nav.style.display = 'none';
        content.innerHTML = `<p class="empty-msg">No one called back yet from ${escHtml(combo?.name || 'this combo')}.<br><span style="font-size:12px;color:#aaa;">Use the + Callback button while observing.</span></p>`;
        return;
      }

      const dancers  = cbDancers();
      const gs       = round.group_size || 8;
      const totalG   = cbTotalGroups();
      if (cbGroupIdx >= totalG) cbGroupIdx = totalG - 1;

      nav.style.display = '';
      document.getElementById('cb-group-label').textContent = `Group ${cbGroupIdx + 1} of ${totalG}`;
      document.getElementById('cb-prev-group').disabled = cbGroupIdx === 0;
      document.getElementById('cb-next-group').disabled = cbGroupIdx >= totalG - 1;

      const lastGs = dancers.length - (totalG - 1) * gs;
      let info = `${dancers.length} dancer${dancers.length !== 1 ? 's' : ''}`;
      if (totalG > 1 && lastGs !== gs) info += `, last group ${lastGs}`;
      document.getElementById('cb-group-info').textContent = info;

      const gsInput = document.getElementById('cb-gs-input');
      if (gsInput && document.activeElement !== gsInput) gsInput.value = String(gs);

      content.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'dancer-grid';
      cbGroupDancers().forEach(d => renderDancerCard(grid, d));
      content.appendChild(grid);
    }

    document.getElementById('cb-prev-group').addEventListener('click', () => {
      if (cbGroupIdx > 0) { cbGroupIdx--; renderCallbackTab(); }
    });
    document.getElementById('cb-next-group').addEventListener('click', () => {
      if (cbGroupIdx < cbTotalGroups() - 1) { cbGroupIdx++; renderCallbackTab(); }
    });

    async function saveCallbackGroupSize() {
      const input = document.getElementById('cb-gs-input');
      const gs = parseInt(input.value);
      if (!gs || gs < 1) return;
      const round = activeCallbackRound();
      if (!round || round.group_size === gs) return;
      const r = await fetch(`/api/audition-days/${dayId}/callback-rounds/${round.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group_size: gs }),
      }).catch(() => null);
      if (r?.ok) {
        const data = await r.json();
        const idx = cbRounds.findIndex(cr => cr.id === round.id);
        if (idx >= 0) cbRounds[idx].group_size = data.group_size;
        cbGroupIdx = 0;
        renderCallbackTab();
      }
    }

    const gsInput = document.getElementById('cb-gs-input');
    gsInput.addEventListener('change', saveCallbackGroupSize);
    gsInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

    async function toggleCallbackFromObserve(submissionId) {
      let round = activeCallbackRound();
      if (!round) {
        const combo = currentCombo();
        const r = await fetch(`/api/audition-days/${dayId}/callback-rounds`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Callbacks', combo_id: activeComboId, group_size: combo?.group_size || 8 }),
        }).catch(() => null);
        if (!r?.ok) return;
        round = await r.json();
        cbRounds.push(round);
      }
      await toggleCallback(submissionId, round.id);
    }

    async function toggleCallback(submissionId, roundId) {
      const round = cbRounds.find(r => r.id === roundId);
      const isIn  = !!(round?.callbacks || []).find(c => String(c.submission_id) === String(submissionId));
      const res = await fetch(
        `/api/audition-days/${dayId}/callback-rounds/${roundId}/callbacks/${submissionId}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: isIn ? 'remove' : 'add' }) }
      ).catch(() => null);
      if (!res?.ok) return;
      await refreshCallbackRounds();
    }

    async function refreshCallbackRounds() {
      const r = await fetch(`/api/audition-days/${dayId}/callback-rounds`).catch(() => null);
      if (r?.ok) {
        cbRounds = await r.json();
        if (activeTab === 'callbacks') renderCallbackTab();
        updateQuickCbButtons();
      }
    }

    function updateQuickCbButtons() {
      const round = activeCallbackRound();
      const cbSet = new Set((round?.callbacks || []).map(c => String(c.submission_id)));
      document.querySelectorAll('.quick-cb-btn').forEach(btn => {
        const isIn = cbSet.has(btn.dataset.sid);
        btn.className = 'quick-cb-btn' + (isIn ? ' active' : '');
        btn.textContent = isIn ? '✓ Called Back' : '+ Callback';
      });
    }

    function startCallbackPoll() {
      if (cbPollTimer) return;
      cbPollTimer = setInterval(refreshCallbackRounds, 3000);
    }

    // ── Review & Finalize ──────────────────────────────────────────────────────
    async function loadReview() {
      const el = document.getElementById('review-content');
      el.innerHTML = '<p class="empty-msg">Loading…</p>';
      const r   = await fetch(`/api/audition-days/${dayId}/review`).catch(() => null);
      if (!r?.ok) { el.innerHTML = '<p class="empty-msg">Could not load review.</p>'; return; }
      const rv = await r.json();

      const allCbSubIds = new Set(
        cbRounds.flatMap(round => (round.callbacks || []).map(c => String(c.submission_id)))
      );

      if (!rv.dancers.length) {
        el.innerHTML = '<p class="empty-msg">No dancers flagged yet. Rate dancers in the Observe tab first.</p>';
        return;
      }

      el.innerHTML = '';
      const combos = rv.combos;

      rv.dancers.forEach(d => {
        const card = document.createElement('div');
        card.className = 'review-card';
        card.dataset.sid = String(d.submission_id);

        const numStr  = d.audition_number != null ? `<span style="color:#aaa;font-weight:400;font-size:13px;">#${d.audition_number} </span>` : '';
        const cbBadge = allCbSubIds.has(String(d.submission_id)) ? '<span class="cb-badge">Called Back</span>' : '';

        let obsHtml = '';
        const obsByPiece = d.observations || {};
        for (const [pid, obsData] of Object.entries(obsByPiece)) {
          const comboItems = combos.map(c => {
            const level = obsData.byCombo?.[String(c.id)];
            if (!level) return '';
            const cls = level === 'high_priority' ? 'prior-hp' : 'prior-p';
            return `<span class="review-combo-item"><span class="text-muted">${escHtml(c.name)}:</span> <span class="${cls}">${levelLabel(level)}</span></span>`;
          }).filter(Boolean).join('');
          if (comboItems) {
            obsHtml += `<div class="review-obs-row"><span class="review-obs-piece">${escHtml(obsData.piece_name)}</span><br>${comboItems}</div>`;
          }
        }

        const noteHtml = d.note ? `<div class="review-note">${escHtml(d.note)}</div>` : '';

        // Final consideration rows — one per piece that has any observation
        const relevantPieces = [...new Set([
          ...Object.keys(obsByPiece).map(Number),
          ...Object.keys(d.finalConsiderations || {}).map(Number),
        ])];

        let finalHtml = '';
        if (relevantPieces.length) {
          const rows = relevantPieces.map(pid => {
            const piece    = allPieces.find(p => p.id === pid);
            const pName    = piece?.name || '(Piece)';
            const current  = (d.finalConsiderations || {})[String(pid)]?.level || null;
            return `
              <div class="final-piece-row">
                <span class="final-piece-name">${escHtml(pName)}</span>
                <div class="final-btns">
                  <button class="final-btn${current === 'priority' ? ' active-p' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="priority">P</button>
                  <button class="final-btn${current === 'high_priority' ? ' active-hp' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="high_priority">HP</button>
                  <button class="final-btn${current === 'not_considering' ? ' active-nc' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="not_considering">Neutral</button>
                </div>
              </div>`;
          }).join('');
          finalHtml = `<div class="review-final-row"><div class="review-final-label">Final Consideration</div>${rows}</div>`;
        }

        card.innerHTML = `
          <div class="review-dancer-name">${numStr}${escHtml(d.first_name)} ${escHtml(d.last_name)}${cbBadge}</div>
          ${obsHtml}${noteHtml}${finalHtml}
        `;

        // Wire final consideration buttons
        card.querySelectorAll('.final-btn').forEach(btn => {
          btn.addEventListener('click', () => saveFinal(
            parseInt(btn.dataset.sub),
            parseInt(btn.dataset.piece),
            btn.dataset.level,
            btn,
            card
          ));
        });

        el.appendChild(card);
      });
    }

    async function saveFinal(submissionId, pieceId, level, clickedBtn, card) {
      const sid = String(submissionId);
      const pid = String(pieceId);

      // Toggle off if same
      const current = myFinal[sid]?.[pid];
      const next    = current === level ? null : level;

      if (!myFinal[sid]) myFinal[sid] = {};
      if (next) myFinal[sid][pid] = next; else delete myFinal[sid][pid];

      // Update button states in review card
      card.querySelectorAll(`.final-btn[data-sub="${submissionId}"][data-piece="${pieceId}"]`).forEach(btn => {
        btn.className = 'final-btn' +
          (btn.dataset.level === 'priority' && next === 'priority' ? ' active-p' : '') +
          (btn.dataset.level === 'high_priority' && next === 'high_priority' ? ' active-hp' : '') +
          (btn.dataset.level === 'not_considering' && next === 'not_considering' ? ' active-nc' : '');
      });

      await fetch(`/api/audition-days/${dayId}/final-considerations`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ submission_id: submissionId, piece_id: pieceId, level: next }),
      }).catch(() => {});
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    let inFinalReview = false;

    document.querySelectorAll('.main-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-observe').style.display   = activeTab === 'observe'   ? '' : 'none';
        document.getElementById('panel-callbacks').style.display = activeTab === 'callbacks' ? '' : 'none';
        if (activeTab === 'callbacks') { cbGroupIdx = 0; startCallbackPoll(); renderCallbackTab(); }
      });
    });

    document.getElementById('final-review-btn').addEventListener('click', () => {
      inFinalReview = !inFinalReview;
      const btn = document.getElementById('final-review-btn');
      if (inFinalReview) {
        btn.textContent = '← Back';
        btn.classList.add('active');
        document.getElementById('combo-tabbar').style.display = 'none';
        document.getElementById('main-tabs').style.display    = 'none';
        document.getElementById('panel-observe').style.display   = 'none';
        document.getElementById('panel-callbacks').style.display = 'none';
        document.getElementById('panel-review').style.display    = '';
        loadReview();
      } else {
        btn.textContent = 'Final Review';
        btn.classList.remove('active');
        document.getElementById('combo-tabbar').style.display = '';
        document.getElementById('main-tabs').style.display    = '';
        document.getElementById('panel-review').style.display    = 'none';
        document.getElementById('panel-observe').style.display   = activeTab === 'observe'   ? '' : 'none';
        document.getElementById('panel-callbacks').style.display = activeTab === 'callbacks' ? '' : 'none';
      }
    });

    // ── Add Combo modal ───────────────────────────────────────────────────────
    function openAddComboModal() {
      const last = allCombos[allCombos.length - 1];
      document.getElementById('new-combo-name').value  = `Combo ${allCombos.length + 1}`;
      document.getElementById('new-combo-gs').value    = last ? String(last.group_size) : '8';
      document.getElementById('new-combo-sort').value  = last ? last.sort_order : 'number';
      updateComboPreview();
      new bootstrap.Modal(document.getElementById('addComboModal')).show();
    }

    function updateComboPreview() {
      const gs = parseInt(document.getElementById('new-combo-gs').value) || 0;
      const n  = allDancers.length;
      const el = document.getElementById('combo-preview');
      if (!gs || !n) { el.textContent = ''; return; }
      if (gs > n) { el.textContent = `Max group size is ${n}.`; el.style.color = '#c0392b'; return; }
      el.style.color = '#8a6820';
      const g   = Math.ceil(n / gs);
      const rem = n % gs;
      const last = rem > 0 ? ` Last group has ${rem} dancer${rem !== 1 ? 's' : ''}.` : '';
      el.textContent = `${n} dancers · ${gs} per group = ${g} group${g !== 1 ? 's' : ''}.${last}`;
    }
    document.getElementById('new-combo-gs').addEventListener('input', updateComboPreview);

    document.getElementById('save-combo-btn').addEventListener('click', async () => {
      const btn  = document.getElementById('save-combo-btn');
      const name = document.getElementById('new-combo-name').value.trim();
      const gs   = parseInt(document.getElementById('new-combo-gs').value) || 8;
      const so   = document.getElementById('new-combo-sort').value;
      btn.disabled = true;
      try {
        const r   = await fetch(`/api/audition-days/${dayId}/combos`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name || `Combo ${allCombos.length + 1}`, group_size: gs, sort_order: so }),
        });
        if (!r.ok) { alert('Could not add combo.'); return; }
        const combo = await r.json();
        allCombos.push(combo);
        activeComboId  = combo.id;
        activeGroupIdx = 0;
        bootstrap.Modal.getInstance(document.getElementById('addComboModal')).hide();
        renderComboTabs();
        renderGroupNav();
        renderDancerList();
      } finally { btn.disabled = false; }
    });


    // ── Initial render ────────────────────────────────────────────────────────
    buildPieceSelector();
    renderComboTabs();
    renderGroupNav();

    function finishInit() {
      // Sync piece selector UI to activePieceId
      const sel = document.getElementById('piece-select');
      if (sel) sel.value = String(activePieceId ?? '');
      renderDancerList();
      updateQuickCbButtons();
      startCallbackPoll();
    }

    function showPieceConfirmModal() {
      const list       = document.getElementById('piece-confirm-list');
      const confirmBtn = document.getElementById('piece-confirm-btn');
      let selectedId   = allPieces.find(p => p.is_mine)?.id ?? null;

      list.innerHTML = '';
      allPieces.forEach(p => {
        const item = document.createElement('div');
        item.dataset.pid = String(p.id);
        item.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid #e8dfc8;background:#fff;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s;';
        item.innerHTML = `
          <div style="width:12px;height:12px;border-radius:3px;flex-shrink:0;background:${p.color || '#6366f1'};"></div>
          <span style="font-size:14px;font-weight:600;color:#2d2512;">${escHtml(p.name)}</span>
          ${p.is_mine ? '<span style="font-size:11px;color:#c9a84c;margin-left:auto;font-weight:600;">yours</span>' : ''}
        `;
        item.addEventListener('click', () => {
          selectedId = p.id;
          list.querySelectorAll('[data-pid]').forEach(el => {
            const on = el.dataset.pid === String(p.id);
            el.style.borderColor = on ? '#c9a84c' : '#e8dfc8';
            el.style.background  = on ? 'rgba(201,168,76,.08)' : '#fff';
          });
          confirmBtn.disabled = false;
        });
        list.appendChild(item);
      });

      // Pre-select "yours" if found
      if (selectedId) {
        const pre = list.querySelector(`[data-pid="${selectedId}"]`);
        if (pre) pre.click();
      }

      confirmBtn.onclick = () => {
        if (!selectedId) return;
        activePieceId = selectedId;
        sessionStorage.setItem(`piece_confirmed_${dayId}`, String(selectedId));
        bootstrap.Modal.getInstance(document.getElementById('pieceConfirmModal')).hide();
        finishInit();
      };

      new bootstrap.Modal(document.getElementById('pieceConfirmModal')).show();
    }

    // Show modal if multiple pieces and not yet confirmed this session
    const sessionKey   = `piece_confirmed_${dayId}`;
    const savedPieceId = sessionStorage.getItem(sessionKey);
    const savedPiece   = allPieces.find(p => String(p.id) === savedPieceId);

    if (allPieces.length > 1 && !savedPiece) {
      showPieceConfirmModal();
    } else {
      if (savedPiece) activePieceId = savedPiece.id;
      finishInit();
    }

  })();
  </script>
</body>
</html>
