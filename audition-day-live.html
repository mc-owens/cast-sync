<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audition Day | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .page-back{font-size:13px;color:#888;text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;}
    .page-back:hover{color:#555;}
    .page-title-bar{border-left:3px solid #c9a84c;padding-left:12px;margin-bottom:4px;}

    /* ── Tab bar ── */
    .tab-bar{display:flex;align-items:stretch;border-bottom:2px solid #e8dfc8;margin-bottom:20px;gap:0;}
    .combo-tabs{display:flex;gap:0;overflow-x:auto;flex:1;scrollbar-width:none;}
    .combo-tabs::-webkit-scrollbar{display:none;}
    .combo-tab{font-size:13px;font-weight:600;color:#aaa;padding:8px 16px;border:none;background:none;
      border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .combo-tab.active{color:#8a6820;border-bottom-color:#c9a84c;}
    .btn-add-combo{font-size:12px;font-weight:600;color:#c9a84c;background:none;
      border:1px dashed rgba(201,168,76,.45);border-radius:20px;padding:3px 11px;cursor:pointer;
      white-space:nowrap;align-self:center;margin:0 8px;flex-shrink:0;}
    .btn-add-combo:hover{background:rgba(201,168,76,.08);}
    .right-tabs{display:flex;gap:0;flex-shrink:0;}
    .right-tab{font-size:13px;font-weight:600;color:#aaa;padding:8px 14px;border:none;background:none;
      border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;}
    .right-tab.active{color:#3d6080;border-bottom-color:#5a7fa0;}

    /* ── Combo info bar ── */
    .combo-info-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12px;color:#999;flex-wrap:wrap;}
    .combo-info-bar strong{color:#444;}
    .btn-combo-edit{font-size:11px;color:#c9a84c;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
    .btn-combo-delete{font-size:13px;color:#ddd;background:none;border:none;cursor:pointer;padding:0 2px;line-height:1;}
    .btn-combo-delete:hover{color:#c0392b;}

    /* ── Group nav ── */
    .group-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    .group-label{font-size:15px;font-weight:600;color:#2d2512;flex:1;text-align:center;}
    .btn-group-nav{background:#fff;border:1px solid #e0d5b8;border-radius:6px;color:#8a6820;
      font-size:18px;line-height:1;width:38px;height:38px;display:flex;align-items:center;
      justify-content:center;cursor:pointer;flex-shrink:0;}
    .btn-group-nav:disabled{color:#ccc;border-color:#eee;cursor:default;}
    .btn-group-nav:not(:disabled):hover{background:#fdf8ee;border-color:#c9a84c;}

    /* ── Dancer card ── */
    .dancer-card{background:#fffdf7;border:1px solid #e8dfc8;border-radius:10px;
      padding:14px 14px 12px;height:100%;display:flex;flex-direction:column;gap:7px;}
    .dancer-card-num{font-size:11px;font-weight:700;color:#b08a3a;text-transform:uppercase;letter-spacing:.04em;}
    .dancer-card-name{font-size:14px;font-weight:600;color:#2d2512;line-height:1.3;}
    .piece-chips{display:flex;flex-wrap:wrap;gap:4px;}
    .piece-chip{font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;cursor:pointer;white-space:nowrap;}
    .piece-chip.priority{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#8a6820;}
    .piece-chip.high-priority{background:#c9a84c;border:1px solid #c9a84c;color:#fff;}
    .btn-piece-rate{width:100%;padding:9px 12px;border-radius:7px;border:1.5px solid rgba(201,168,76,.4);
      background:transparent;color:#8a6820;font-size:13px;font-weight:600;cursor:pointer;text-align:left;
      transition:background .12s,border-color .12s;}
    .btn-piece-rate:hover{background:rgba(201,168,76,.08);}
    .btn-callback{width:100%;padding:9px 12px;border-radius:7px;border:1.5px solid rgba(90,127,160,.35);
      background:transparent;color:#3d6080;font-size:13px;font-weight:600;cursor:pointer;text-align:left;
      transition:background .12s,border-color .12s,color .12s;}
    .btn-callback.active{background:#5a7fa0;border-color:#5a7fa0;color:#fff;}
    .dancer-note-input{width:100%;font-size:12px;border:1px solid #e0d5b8;border-radius:6px;
      padding:6px 10px;background:#fff;color:#444;outline:none;}
    .dancer-note-input:focus{border-color:#c9a84c;}
    .dancer-note-input::placeholder{color:#bbb;}

    .save-indicator{font-size:11px;color:#b08a3a;opacity:0;transition:opacity .2s;text-align:right;min-height:16px;margin-top:4px;}
    .save-indicator.show{opacity:1;}
    .empty-state{text-align:center;padding:40px 20px;color:#aaa;font-size:13px;}

    /* ── Spider ── */
    .spider-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;
      display:flex;align-items:center;justify-content:center;padding:16px;}
    .spider-modal{background:#fff;border-radius:14px;width:100%;max-width:380px;
      max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18);}
    .spider-header{display:flex;align-items:center;justify-content:space-between;
      padding:16px 18px 12px;border-bottom:1px solid #f0e8d5;}
    .spider-dancer-name{font-size:15px;font-weight:700;color:#2d2512;}
    .spider-close{background:none;border:none;font-size:22px;color:#aaa;cursor:pointer;line-height:1;padding:0;}
    .spider-close:hover{color:#555;}
    .spider-hint{font-size:11px;color:#aaa;padding:8px 18px 4px;}
    .spider-pieces-list{overflow-y:auto;padding-bottom:8px;}
    .spider-piece-row{display:flex;align-items:center;justify-content:space-between;
      padding:10px 18px;gap:12px;}
    .spider-piece-row:hover{background:#fdfaf4;}
    .spider-piece-name{font-size:13px;font-weight:600;color:#333;flex:1;min-width:0;word-break:break-word;}
    .yours-tag{font-size:10px;font-weight:600;background:rgba(201,168,76,.15);color:#8a6820;
      border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:1px 6px;margin-left:6px;display:inline-block;}
    .spider-level-btns{display:flex;gap:6px;flex-shrink:0;}
    .spi-btn{font-size:11px;font-weight:700;border-radius:6px;padding:5px 10px;cursor:pointer;
      border:1.5px solid rgba(201,168,76,.4);background:transparent;color:#8a6820;transition:all .12s;}
    .spi-btn:hover{background:rgba(201,168,76,.1);}
    .spi-btn.active{background:#c9a84c;border-color:#c9a84c;color:#fff;}
    .spi-btn.hp{border-color:rgba(180,120,30,.5);color:#7a5510;}
    .spi-btn.hp:hover{background:rgba(180,120,30,.08);}
    .spi-btn.hp.active{background:#a06e10;border-color:#a06e10;color:#fff;}

    /* ── Review ── */
    .review-filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
    .review-pill{font-size:12px;font-weight:600;border-radius:20px;padding:4px 14px;
      border:1px solid rgba(201,168,76,.4);background:transparent;color:#8a6820;cursor:pointer;}
    .review-pill.active{background:#c9a84c;border-color:#c9a84c;color:#fff;}
    .review-pill.cb{border-color:rgba(90,127,160,.35);color:#3d6080;}
    .review-pill.cb.active{background:#5a7fa0;border-color:#5a7fa0;color:#fff;}
    .review-row{border:1px solid #e8dfc8;border-left:3px solid #c9a84c;border-radius:8px;
      background:#fffdf7;padding:12px 14px;margin-bottom:8px;}
    .review-row-header{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
    .review-row-num{font-size:11px;font-weight:700;color:#b08a3a;}
    .review-row-name{font-size:14px;font-weight:700;color:#2d2512;flex:1;}
    .review-badge-cb{font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px;
      background:rgba(90,127,160,.12);color:#3d6080;border:1px solid rgba(90,127,160,.3);}
    .review-piece-section{margin-top:6px;}
    .review-piece-label{font-size:11px;font-weight:700;color:#8a6820;text-transform:uppercase;
      letter-spacing:.04em;margin-bottom:3px;}
    .review-piece-row{font-size:12px;color:#555;display:flex;align-items:center;gap:6px;margin-bottom:2px;}
    .review-level-badge{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;
      background:#a06e10;color:#fff;}
    .review-level-badge.p{background:rgba(201,168,76,.2);color:#8a6820;}
    .review-note-row{font-size:12px;color:#777;font-style:italic;margin-top:5px;}
  </style>
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell.js"></script>

  <div class="app-main">
    <div class="container mt-4" style="max-width:720px;">

      <a href="audition-day.html" class="page-back">← Audition Day</a>
      <h4 class="fw-semibold page-title-bar mb-3" id="page-heading">Loading…</h4>

      <!-- Tab bar -->
      <div class="tab-bar">
        <div class="combo-tabs" id="combo-tabs"></div>
        <button class="btn-add-combo" id="add-combo-btn">+ Combo</button>
        <div class="right-tabs">
          <button class="right-tab" id="tab-callbacks" onclick="switchPanel('callbacks')">↩ Callbacks</button>
          <button class="right-tab" id="tab-review" onclick="switchPanel('review')">Review</button>
        </div>
      </div>

      <!-- Combo panel -->
      <div id="panel-combo">
        <div class="combo-info-bar" id="combo-info-bar"></div>
        <div class="group-nav">
          <button class="btn-group-nav" id="btn-prev" onclick="prevGroup()">‹</button>
          <div class="group-label" id="group-label">Group 1 of 1</div>
          <button class="btn-group-nav" id="btn-next" onclick="nextGroup()">›</button>
        </div>
        <div class="row g-3" id="dancer-grid"></div>
        <div class="save-indicator mt-2" id="save-indicator">Saved</div>
      </div>

      <!-- Callbacks panel -->
      <div id="panel-callbacks" style="display:none;">
        <div id="callback-setup">
          <p id="callback-count-text" style="font-size:14px;color:#555;margin-bottom:12px;"></p>
          <div id="callback-config" style="display:none;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
              <input type="number" id="callback-group-size" class="form-control" style="width:80px;" value="5" min="1" oninput="updateCallbackPreview()">
              <span style="font-size:13px;color:#555;">per group</span>
            </div>
            <div id="callback-preview" style="font-size:12px;color:#8a6820;margin-bottom:16px;min-height:18px;"></div>
            <button class="btn btn-dark btn-sm" onclick="startCallbackRound()">Start Callback Round</button>
          </div>
        </div>
        <div id="callback-groups-panel" style="display:none;">
          <button class="btn btn-link btn-sm p-0 mb-3" style="font-size:12px;color:#999;" onclick="resetCallbackSetup()">← Change group size</button>
          <div class="group-nav">
            <button class="btn-group-nav" id="btn-cb-prev" onclick="prevCallbackGroup()">‹</button>
            <div class="group-label" id="cb-group-label">Callback Group 1 of 1</div>
            <button class="btn-group-nav" id="btn-cb-next" onclick="nextCallbackGroup()">›</button>
          </div>
          <div class="row g-3" id="callback-dancer-grid"></div>
          <div class="save-indicator mt-2" id="save-indicator-cb">Saved</div>
        </div>
      </div>

      <!-- Review panel -->
      <div id="panel-review" style="display:none;">
        <div class="review-filter-bar">
          <button class="review-pill active" onclick="setReviewFilter('all')">All</button>
          <button class="review-pill" onclick="setReviewFilter('rated')">Has Ratings</button>
          <button class="review-pill cb" onclick="setReviewFilter('callback')">↩ Callback</button>
        </div>
        <div id="review-list"></div>
      </div>

    </div>
  </div>

  <!-- Spider overlay -->
  <div class="spider-overlay" id="spider-overlay" style="display:none;" onclick="handleOverlayClick(event)">
    <div class="spider-modal">
      <div class="spider-header">
        <div class="spider-dancer-name" id="spider-name"></div>
        <button class="spider-close" onclick="closeSpider()">×</button>
      </div>
      <div class="spider-hint">P = Priority &nbsp;·&nbsp; HP = High Priority &nbsp;·&nbsp; tap again to remove</div>
      <div class="spider-pieces-list" id="spider-pieces"></div>
    </div>
  </div>

  <!-- Add Combo modal -->
  <div class="modal fade" id="addComboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:15px;">Add Combo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Name</label>
            <input type="text" id="new-combo-name" class="form-control" autocomplete="off">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Group Size</label>
              <input type="number" id="new-combo-gs" class="form-control" value="8" min="1" max="500" oninput="updateNewComboPreview()">
            </div>
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Sort By</label>
              <select id="new-combo-sort" class="form-select">
                <option value="number">Audition #</option>
                <option value="last_name">Last Name</option>
                <option value="first_name">First Name</option>
              </select>
            </div>
          </div>
          <div id="new-combo-preview" style="font-size:12px;color:#8a6820;margin-top:8px;min-height:18px;"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="save-new-combo-btn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Combo modal -->
  <div class="modal fade" id="editComboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:15px;">Edit Combo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Name</label>
            <input type="text" id="edit-combo-name" class="form-control" autocomplete="off">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Group Size</label>
              <input type="number" id="edit-combo-gs" class="form-control" min="1" max="500" oninput="updateEditComboPreview()">
            </div>
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Sort By</label>
              <select id="edit-combo-sort" class="form-select">
                <option value="number">Audition #</option>
                <option value="last_name">Last Name</option>
                <option value="first_name">First Name</option>
              </select>
            </div>
          </div>
          <div id="edit-combo-preview" style="font-size:12px;color:#8a6820;margin-top:8px;min-height:18px;"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="save-edit-combo-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  const params = new URLSearchParams(location.search);
  const dayId  = params.get('id');
  if (!dayId) { window.location.href = 'audition-day.html'; }

  let day, allDancers, allPieces, allCombos;
  let myGeneralRatings = {}, myPieceRatings = {};
  let currentUserId = null, activeComboId = null;
  let currentGroup = 0, activeGroups = [];
  let saveTimer = null;
  let reviewData = null, reviewFilter = 'all';
  let callbackDancers = [], callbackGroups = [], currentCBGroup = 0;
  let spiderSubId = null;

  const getModal = id => bootstrap.Modal.getOrCreateInstance(document.getElementById(id));

  (async () => {
    const authRes = await fetch('/api/auth/me');
    const user    = await authRes.json();
    if (!authRes.ok || (user.mode !== 'director' && user.role !== 'master')) {
      window.location.href = 'login.html'; return;
    }
    currentUserId = user.id;

    document.getElementById('right-nav').innerHTML =
      `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    const r    = await fetch(`/api/audition-days/${dayId}`);
    const data = r.ok ? await r.json() : null;
    if (!data) { window.location.href = 'audition-day.html'; return; }

    day              = data.day;
    allCombos        = data.combos;
    allPieces        = data.pieces;
    allDancers       = data.dancers;
    myGeneralRatings = data.myGeneralRatings || {};
    myPieceRatings   = data.myPieceRatings   || {};

    document.getElementById('page-heading').textContent = day.name;
    document.title = `${day.name} | CastSync`;
    document.body.style.visibility = 'visible';

    renderComboTabs();
    if (allCombos.length > 0) selectCombo(allCombos[0].id);
  })();

  // ── Combos ────────────────────────────────────────────────────────────────

  function renderComboTabs() {
    document.getElementById('combo-tabs').innerHTML = allCombos.map(c =>
      `<button class="combo-tab${c.id === activeComboId ? ' active' : ''}"
               onclick="selectCombo(${c.id})">${escHtml(c.name)}</button>`
    ).join('');
  }

  function selectCombo(id) {
    activeComboId = id;
    currentGroup  = 0;
    const combo   = allCombos.find(c => c.id === id);
    activeGroups  = makeGroups(sortDancers(allDancers, combo.sort_order), combo.group_size);

    renderComboTabs();
    showPanel('combo');
    renderComboInfoBar(combo);
    renderGroup();
  }

  function renderComboInfoBar(combo) {
    const sortLabel = { number:'audition #', first_name:'first name', last_name:'last name' }[combo.sort_order] || combo.sort_order;
    const canDelete = allCombos.length > 1;
    document.getElementById('combo-info-bar').innerHTML =
      `<strong>${escHtml(combo.name)}</strong>
       <span>·</span>
       <span>${combo.group_size} per group · by ${sortLabel}</span>
       <button class="btn-combo-edit" onclick="openEditCombo(${combo.id})">Edit</button>
       ${canDelete ? `<button class="btn-combo-delete" onclick="confirmDeleteCombo(${combo.id})" title="Delete">✕</button>` : ''}`;
  }

  function openEditCombo(id) {
    const c = allCombos.find(c => c.id === id);
    document.getElementById('edit-combo-name').value = c.name;
    document.getElementById('edit-combo-gs').value   = c.group_size;
    document.getElementById('edit-combo-sort').value = c.sort_order;
    updateEditComboPreview();
    document.getElementById('save-edit-combo-btn').onclick = () => saveEditCombo(id);
    getModal('editComboModal').show();
  }

  function updateEditComboPreview() {
    const gs = parseInt(document.getElementById('edit-combo-gs').value)||0;
    const n  = allDancers.length;
    const el = document.getElementById('edit-combo-preview');
    if (!gs||!n){el.textContent='';return;}
    el.textContent = `${n} dancers · ${gs} per group = ${Math.ceil(n/gs)} group${Math.ceil(n/gs)!==1?'s':''}`;
  }

  async function saveEditCombo(id) {
    const name       = document.getElementById('edit-combo-name').value.trim();
    const group_size = parseInt(document.getElementById('edit-combo-gs').value)||8;
    const sort_order = document.getElementById('edit-combo-sort').value;
    await fetch(`/api/audition-days/${dayId}/combos/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, group_size, sort_order })
    });
    const idx = allCombos.findIndex(c => c.id === id);
    if (idx >= 0) allCombos[idx] = { ...allCombos[idx], name, group_size, sort_order };
    getModal('editComboModal').hide();
    selectCombo(id);
  }

  function confirmDeleteCombo(id) {
    if (!confirm('Delete this combo?')) return;
    deleteCombo(id);
  }

  async function deleteCombo(id) {
    const r = await fetch(`/api/audition-days/${dayId}/combos/${id}`, { method:'DELETE' });
    if (!r.ok) { alert((await r.json()).error||'Could not delete.'); return; }
    allCombos = allCombos.filter(c => c.id !== id);
    renderComboTabs();
    selectCombo(allCombos[0].id);
  }

  document.getElementById('add-combo-btn').addEventListener('click', () => {
    const nextNum = allCombos.length + 1;
    document.getElementById('new-combo-name').value = `Combo ${nextNum}`;
    document.getElementById('new-combo-gs').value   = '8';
    document.getElementById('new-combo-sort').value = 'number';
    updateNewComboPreview();
    getModal('addComboModal').show();
    setTimeout(()=>document.getElementById('new-combo-name').focus(), 300);
  });

  function updateNewComboPreview() {
    const gs = parseInt(document.getElementById('new-combo-gs').value)||0;
    const n  = allDancers.length;
    const el = document.getElementById('new-combo-preview');
    if (!gs||!n){el.textContent='';return;}
    el.textContent = `${n} dancers · ${gs} per group = ${Math.ceil(n/gs)} group${Math.ceil(n/gs)!==1?'s':''}`;
  }

  document.getElementById('save-new-combo-btn').addEventListener('click', async () => {
    const name       = document.getElementById('new-combo-name').value.trim() || `Combo ${allCombos.length+1}`;
    const group_size = parseInt(document.getElementById('new-combo-gs').value)||8;
    const sort_order = document.getElementById('new-combo-sort').value;
    const r = await fetch(`/api/audition-days/${dayId}/combos`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, group_size, sort_order })
    });
    const combo = await r.json();
    allCombos.push(combo);
    getModal('addComboModal').hide();
    renderComboTabs();
    selectCombo(combo.id);
  });

  // ── Group navigation ───────────────────────────────────────────────────────

  function renderGroup() {
    const group = activeGroups[currentGroup] || [];
    const total = activeGroups.length || 1;
    document.getElementById('group-label').textContent = `Group ${currentGroup+1} of ${total}`;
    document.getElementById('btn-prev').disabled = currentGroup === 0;
    document.getElementById('btn-next').disabled = currentGroup >= total-1;
    document.getElementById('dancer-grid').innerHTML = group.length
      ? group.map(d => dancerCardHtml(d)).join('')
      : `<div class="col-12"><div class="empty-state">No dancers.</div></div>`;
  }

  function prevGroup() { if (currentGroup>0){currentGroup--;renderGroup();} }
  function nextGroup() { if (currentGroup<activeGroups.length-1){currentGroup++;renderGroup();} }

  // ── Dancer card ───────────────────────────────────────────────────────────

  function dancerCardHtml(d) {
    const g    = myGeneralRatings[d.submission_id] || {};
    const num  = d.audition_number ? `#${d.audition_number}` : '';
    const name = dancerDisplayName(d);
    const chips = buildChipsHtml(d.submission_id);
    return `
      <div class="col-6 col-md-4">
        <div class="dancer-card">
          <div>
            ${num ? `<div class="dancer-card-num">${escHtml(num)}</div>` : ''}
            <div class="dancer-card-name">${escHtml(name)}</div>
          </div>
          <div class="piece-chips" id="chips-${d.submission_id}"${chips?'':' style="display:none;"'}>${chips}</div>
          <button class="btn-piece-rate" onclick="openSpider(${d.submission_id})">
            ★ Priority / High Priority
          </button>
          <button class="btn-callback${g.callback?' active':''}"
                  onclick="toggleCallback(${d.submission_id}, this)">↩ Callback</button>
          <input class="dancer-note-input" type="text" maxlength="200"
                 placeholder="Note (optional)"
                 value="${escAttr(g.note||'')}"
                 onblur="saveNote(${d.submission_id}, this.value)">
        </div>
      </div>`;
  }

  function buildChipsHtml(subId) {
    return Object.entries(myPieceRatings[subId]||{}).map(([pid, level]) => {
      const piece = allPieces.find(p => p.id == pid);
      if (!piece) return '';
      const cls = level==='high_priority' ? 'high-priority' : 'priority';
      const lbl = level==='high_priority' ? 'HP' : 'P';
      const short = piece.name.length > 14 ? piece.name.slice(0,14)+'…' : piece.name;
      return `<span class="piece-chip ${cls}" onclick="openSpider(${subId})" title="${escAttr(piece.name)}">${escHtml(short)} ${lbl}</span>`;
    }).join('');
  }

  function updateCardChips(subId) {
    const el = document.getElementById(`chips-${subId}`);
    if (!el) return;
    const html = buildChipsHtml(subId);
    el.innerHTML = html;
    el.style.display = html ? '' : 'none';
  }

  // ── Callback + Note ────────────────────────────────────────────────────────

  async function toggleCallback(subId, btn) {
    const g = myGeneralRatings[subId] || {};
    g.callback = !g.callback;
    myGeneralRatings[subId] = g;
    btn.classList.toggle('active', g.callback);
    showSaved('save-indicator');
    await fetch(`/api/audition-days/${dayId}/ratings/${subId}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ callback: g.callback, note: g.note||null })
    });
  }

  async function saveNote(subId, value) {
    const g = myGeneralRatings[subId] || {};
    g.note = value.trim() || null;
    myGeneralRatings[subId] = g;
    showSaved('save-indicator');
    await fetch(`/api/audition-days/${dayId}/ratings/${subId}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ callback: g.callback||false, note: g.note })
    });
  }

  // ── Spider ────────────────────────────────────────────────────────────────

  function openSpider(subId) {
    spiderSubId = subId;
    const dancer = allDancers.find(d => d.submission_id === subId);
    document.getElementById('spider-name').textContent = dancerDisplayName(dancer);
    renderSpider(subId);
    document.getElementById('spider-overlay').style.display = 'flex';
  }

  function closeSpider() {
    document.getElementById('spider-overlay').style.display = 'none';
    spiderSubId = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('spider-overlay')) closeSpider();
  }

  function renderSpider(subId) {
    const ratings = myPieceRatings[subId] || {};
    if (allPieces.length === 0) {
      document.getElementById('spider-pieces').innerHTML =
        `<div class="empty-state" style="padding:24px;">No pieces in this production yet.</div>`;
      return;
    }
    document.getElementById('spider-pieces').innerHTML = allPieces.map(p => {
      const current = ratings[p.id] || null;
      const isYours = p.master_id == currentUserId;
      return `
        <div class="spider-piece-row">
          <div class="spider-piece-name">
            ${escHtml(p.name)}
            ${isYours ? `<span class="yours-tag">yours</span>` : ''}
          </div>
          <div class="spider-level-btns">
            <button class="spi-btn${current==='priority'?' active':''}"
                    onclick="setPieceRating(${subId},${p.id},'priority')">P</button>
            <button class="spi-btn hp${current==='high_priority'?' active':''}"
                    onclick="setPieceRating(${subId},${p.id},'high_priority')">HP</button>
          </div>
        </div>`;
    }).join('');
  }

  async function setPieceRating(subId, pieceId, level) {
    if (!myPieceRatings[subId]) myPieceRatings[subId] = {};
    const current  = myPieceRatings[subId][pieceId];
    const newLevel = current === level ? null : level;
    if (newLevel) myPieceRatings[subId][pieceId] = newLevel;
    else          delete myPieceRatings[subId][pieceId];
    renderSpider(subId);
    updateCardChips(subId);
    showSaved('save-indicator');
    await fetch(`/api/audition-days/${dayId}/piece-ratings`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ submission_id: subId, piece_id: pieceId, level: newLevel })
    });
  }

  // ── Panel switching ────────────────────────────────────────────────────────

  function showPanel(name) {
    ['combo','callbacks','review'].forEach(p => {
      document.getElementById(`panel-${p}`).style.display = p===name ? '' : 'none';
    });
    document.getElementById('tab-callbacks').classList.toggle('active', name==='callbacks');
    document.getElementById('tab-review').classList.toggle('active', name==='review');
    if (name !== 'combo') {
      document.querySelectorAll('.combo-tab').forEach(t => t.classList.remove('active'));
    }
  }

  function switchPanel(name) {
    showPanel(name);
    if (name === 'callbacks') openCallbackPanel();
    if (name === 'review')    loadReview();
  }

  // ── Callbacks ─────────────────────────────────────────────────────────────

  function openCallbackPanel() {
    callbackDancers = allDancers.filter(d => (myGeneralRatings[d.submission_id]||{}).callback);
    const n   = callbackDancers.length;
    const gsEl = document.getElementById('callback-group-size');
    document.getElementById('callback-setup').style.display      = '';
    document.getElementById('callback-groups-panel').style.display = 'none';
    document.getElementById('callback-count-text').textContent =
      n === 0 ? 'No dancers marked for callback yet. Use the ↩ Callback button on dancer cards.'
              : `You have ${n} dancer${n!==1?'s':''} marked for callback.`;
    document.getElementById('callback-config').style.display = n > 0 ? '' : 'none';
    if (n > 0) {
      gsEl.max = n;
      if (parseInt(gsEl.value) > n) gsEl.value = n;
      updateCallbackPreview();
    }
  }

  function updateCallbackPreview() {
    const n  = callbackDancers.length;
    const gs = parseInt(document.getElementById('callback-group-size').value)||0;
    const el = document.getElementById('callback-preview');
    if (!gs||!n){el.textContent='';return;}
    if (gs>n){el.textContent=`Max is ${n}.`;el.style.color='#c0392b';return;}
    el.style.color='#8a6820';
    const g = Math.ceil(n/gs);
    el.textContent = `${gs} per group = ${g} group${g!==1?'s':''}`;
  }

  function startCallbackRound() {
    const n  = callbackDancers.length;
    const gs = Math.max(1, Math.min(n, parseInt(document.getElementById('callback-group-size').value)||1));
    callbackGroups = makeGroups(callbackDancers, gs);
    currentCBGroup = 0;
    document.getElementById('callback-setup').style.display      = 'none';
    document.getElementById('callback-groups-panel').style.display = '';
    renderCallbackGroup();
  }

  function resetCallbackSetup() {
    document.getElementById('callback-setup').style.display      = '';
    document.getElementById('callback-groups-panel').style.display = 'none';
  }

  function prevCallbackGroup() { if(currentCBGroup>0){currentCBGroup--;renderCallbackGroup();} }
  function nextCallbackGroup() { if(currentCBGroup<callbackGroups.length-1){currentCBGroup++;renderCallbackGroup();} }

  function renderCallbackGroup() {
    const group = callbackGroups[currentCBGroup]||[];
    const total = callbackGroups.length;
    document.getElementById('cb-group-label').textContent = `Callback Group ${currentCBGroup+1} of ${total}`;
    document.getElementById('btn-cb-prev').disabled = currentCBGroup===0;
    document.getElementById('btn-cb-next').disabled = currentCBGroup>=total-1;
    document.getElementById('callback-dancer-grid').innerHTML = group.map(d => dancerCardHtml(d)).join('');
  }

  // ── Review ────────────────────────────────────────────────────────────────

  async function loadReview() {
    const r    = await fetch(`/api/audition-days/${dayId}/review`);
    const data = r.ok ? await r.json() : null;
    if (!data) return;
    const combo = allCombos.find(c=>c.id===activeComboId)||allCombos[0];
    reviewData = sortDancers(data.dancers, combo?.sort_order||'last_name');
    renderReview();
  }

  function setReviewFilter(f) {
    reviewFilter = f;
    document.querySelectorAll('.review-pill').forEach(p => {
      const pf = p.textContent.includes('Ratings')?'rated':p.textContent.includes('Callback')?'callback':'all';
      p.classList.toggle('active', pf===f);
    });
    renderReview();
  }

  function renderReview() {
    if (!reviewData) return;
    const el = document.getElementById('review-list');
    const filtered = reviewData.filter(d => {
      if (reviewFilter==='all') return true;
      if (reviewFilter==='rated') return Object.keys(d.piece_ratings||{}).length>0;
      if (reviewFilter==='callback') return d.callback;
      return true;
    });
    if (filtered.length===0) {
      el.innerHTML=`<div class="empty-state">No dancers match this filter.</div>`; return;
    }
    el.innerHTML = filtered.map(d => {
      const num  = d.audition_number ? `#${d.audition_number}` : '';
      const name = dancerDisplayName(d);
      const pieceSections = Object.values(d.piece_ratings||{}).map(pe => {
        const rows = pe.ratings.map(r => {
          const isOwner = r.rater_id == pe.piece_master_id;
          const lvlCls  = r.level==='high_priority' ? '' : ' p';
          const lvlLbl  = r.level==='high_priority' ? 'HP' : 'P';
          const rLabel  = isOwner
            ? `${escHtml(r.rater)} <em style="font-size:10px;color:#aaa;">· Choreographer</em>`
            : escHtml(r.rater);
          return `<div class="review-piece-row"><span class="review-level-badge${lvlCls}">${lvlLbl}</span> ${rLabel}</div>`;
        }).join('');
        return `<div class="review-piece-section"><div class="review-piece-label">${escHtml(pe.piece_name)}</div>${rows}</div>`;
      }).join('');
      const notes = (d.notes||[]).map(n =>
        `<div class="review-note-row">"${escHtml(n.note)}" <span style="font-size:11px;color:#bbb;">— ${escHtml(n.rater)}</span></div>`
      ).join('');
      return `
        <div class="review-row">
          <div class="review-row-header">
            ${num?`<span class="review-row-num">${escHtml(num)}</span>`:''}
            <span class="review-row-name">${escHtml(name)}</span>
            ${d.callback?`<span class="review-badge-cb">↩ Callback</span>`:''}
          </div>
          ${pieceSections}
          ${notes}
        </div>`;
    }).join('');
  }

  // ── Helpers ────────────────────────────────────────────────────────────────

  function sortDancers(dancers, order) {
    return [...dancers].sort((a,b) => {
      if (order==='number') {
        const na=parseInt(a.audition_number)||99999,nb=parseInt(b.audition_number)||99999;
        return na-nb||(a.last_name||'').localeCompare(b.last_name||'');
      }
      if (order==='first_name')
        return (a.first_name||'').localeCompare(b.first_name||'')||(a.last_name||'').localeCompare(b.last_name||'');
      return (a.last_name||'').localeCompare(b.last_name||'')||(a.first_name||'').localeCompare(b.first_name||'');
    });
  }

  function makeGroups(dancers, size) {
    const out=[];
    for (let i=0;i<dancers.length;i+=size) out.push(dancers.slice(i,i+size));
    return out.length ? out : [[]];
  }

  function dancerDisplayName(d) {
    if (d?.first_name||d?.last_name) return [d.last_name,d.first_name].filter(Boolean).join(', ');
    return d?.email||'—';
  }

  function showSaved(id) {
    const el=document.getElementById(id);
    if(!el)return;
    el.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>el.classList.remove('show'),1400);
  }

  function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  </script>
</body>
</html>
