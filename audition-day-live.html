<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Audition Day Live | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body { background: #fffdf7; }

    /* ── Top strips ── */
    #day-header {
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
      padding: 10px 16px 0;
    }
    #day-title { font-size: 15px; font-weight: 700; color: #2d2512; }
    #day-date  { font-size: 12px; color: #aaa; margin-left: 8px; }

    /* ── Combo tabs ── */
    #combo-tabbar {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #combo-tabbar::-webkit-scrollbar { display: none; }
    .combo-tab {
      flex-shrink: 0;
      padding: 5px 14px;
      border-radius: 20px 20px 0 0;
      border: 1px solid #e8dfc8;
      border-bottom: none;
      background: #f5f0e8;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
    }
    .combo-tab.active { background: #fff; color: #2d2512; }
    #add-combo-btn {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px dashed #c9a84c;
      background: transparent;
      font-size: 12px;
      color: #c9a84c;
      cursor: pointer;
      align-self: center;
      margin-bottom: 4px;
      margin-left: 4px;
    }

    /* ── Main tabs ── */
    #main-tabs {
      display: flex;
      border-bottom: 2px solid #e8dfc8;
      background: #fff;
      padding: 0 16px;
    }
    .main-tab {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
    }
    .main-tab.active { color: #2d2512; border-bottom-color: #c9a84c; }

    /* ── Observe controls bar ── */
    #observe-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
      flex-wrap: wrap;
    }
    #piece-select {
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #e8dfc8;
      border-radius: 6px;
      padding: 4px 10px;
      background: #fffdf7;
      color: #2d2512;
      max-width: 220px;
    }
    #group-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      white-space: nowrap;
    }
    .group-nav-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid #e8dfc8;
      background: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .group-nav-btn:disabled { opacity: .35; cursor: default; }

    /* ── Dancer cards ── */
    #dancer-list { padding: 12px 16px; }
    .dancer-card {
      background: #fff;
      border: 1px solid #e8dfc8;
      border-left: 3px solid #e8dfc8;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 8px;
      transition: border-left-color .1s;
    }
    .dancer-card.has-hp  { border-left-color: #c9a84c; }
    .dancer-card.has-p   { border-left-color: rgba(201,168,76,.45); }
    .dancer-card.has-note { background: #faf8f2; }

    .dancer-name {
      font-size: 14px;
      font-weight: 600;
      color: #2d2512;
      margin-bottom: 6px;
    }
    .dancer-num { color: #aaa; font-weight: 400; font-size: 13px; margin-right: 4px; }

    .obs-btns { display: flex; gap: 8px; align-items: center; }
    .obs-btn {
      padding: 4px 14px;
      border-radius: 6px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #888;
      transition: all .1s;
    }
    .obs-btn.active-p  { background: rgba(201,168,76,.15); border-color: #c9a84c; color: #8a6820; }
    .obs-btn.active-hp { background: #c9a84c; border-color: #b8973d; color: #fff; }

    .note-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #bbb;
      padding: 2px 4px;
      margin-left: 4px;
    }
    .note-btn.has-note { color: #c9a84c; }

    .prior-context {
      font-size: 11px;
      color: #aaa;
      margin-top: 5px;
    }
    .prior-context span { margin-right: 10px; }
    .prior-hp { color: #b8973d; font-weight: 600; }
    .prior-p  { color: #a08030; }

    .note-field {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      border: 1px solid #e8dfc8;
      border-radius: 6px;
      padding: 6px 8px;
      background: #fffdf7;
      resize: vertical;
      min-height: 52px;
      font-family: inherit;
    }

    /* ── Callback panel ── */
    #round-tabbar {
      display: flex;
      gap: 4px;
      padding: 10px 16px 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: #fff;
      border-bottom: 1px solid #e8dfc8;
    }
    #round-tabbar::-webkit-scrollbar { display: none; }
    .round-tab {
      flex-shrink: 0;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid #e8dfc8;
      background: #f5f0e8;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
    }
    .round-tab.active { background: #2d2512; color: #fff; border-color: #2d2512; }
    #add-round-btn {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px dashed #c9a84c;
      background: transparent;
      font-size: 12px;
      color: #c9a84c;
      cursor: pointer;
      align-self: center;
      margin-bottom: 0;
    }

    #callback-content { padding: 12px 16px; }
    .callback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid #e8dfc8;
      border-radius: 7px;
      margin-bottom: 6px;
    }
    .callback-row.is-callback { background: rgba(201,168,76,.07); border-color: rgba(201,168,76,.4); }
    .callback-name { font-size: 14px; color: #2d2512; }
    .callback-name .cb-num { color: #aaa; font-size: 12px; margin-right: 4px; }
    .callback-attribution { font-size: 11px; color: #aaa; margin-top: 2px; }
    .cb-toggle {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      flex-shrink: 0;
    }
    .cb-toggle.active { background: #c9a84c; border-color: #b8973d; color: #fff; }

    /* ── Review panel ── */
    #panel-review { padding: 12px 16px; }
    .review-card {
      background: #fff;
      border: 1px solid #e8dfc8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .review-dancer-name { font-size: 14px; font-weight: 700; color: #2d2512; margin-bottom: 8px; }
    .review-obs-row { font-size: 12px; color: #555; margin-bottom: 4px; }
    .review-obs-piece { font-weight: 600; color: #2d2512; }
    .review-combo-item { display: inline-block; margin-right: 10px; }
    .review-note { font-size: 12px; color: #777; font-style: italic; margin: 6px 0; padding: 6px 8px; background: #faf8f2; border-radius: 5px; border-left: 2px solid #c9a84c; }
    .review-final-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0ede5; }
    .review-final-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; margin-bottom: 6px; }
    .final-piece-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .final-piece-name { font-size: 12px; color: #555; flex: 1; }
    .final-btns { display: flex; gap: 6px; }
    .final-btn {
      padding: 3px 10px;
      border-radius: 5px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #888;
    }
    .final-btn.active-p  { background: rgba(201,168,76,.15); border-color: #c9a84c; color: #8a6820; }
    .final-btn.active-hp { background: #c9a84c; border-color: #b8973d; color: #fff; }
    .final-btn.active-nc { background: #f3f4f6; border-color: #9ca3af; color: #555; }

    /* ── Add combo modal ── */
    .modal-content { border-radius: 12px; }

    /* ── Empty states ── */
    .empty-msg { color: #aaa; font-size: 13px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell.js"></script>

  <div class="app-main" style="padding-left:0;padding-right:0;max-width:680px;margin:0 auto;">

    <!-- Day header + combo tabs + main tabs -->
    <div id="day-header">
      <div class="d-flex align-items-center mb-1">
        <a href="audition-day.html" style="color:#aaa;font-size:13px;margin-right:12px;text-decoration:none;">← Back</a>
        <span id="day-title"></span>
        <span id="day-date"></span>
      </div>
      <div id="combo-tabbar">
        <!-- filled by renderComboTabs() -->
      </div>
    </div>

    <div id="main-tabs">
      <button class="main-tab active" data-tab="observe">Observe</button>
      <button class="main-tab" data-tab="callbacks">Callbacks</button>
      <button class="main-tab" data-tab="review">Review</button>
    </div>

    <!-- ── Observe panel ── -->
    <div id="panel-observe">
      <div id="observe-controls">
        <div class="d-flex align-items-center gap-2">
          <span style="font-size:12px;color:#888;white-space:nowrap;">For:</span>
          <select id="piece-select" class="form-select form-select-sm" style="max-width:220px;font-weight:600;"></select>
        </div>
        <div id="group-nav">
          <button class="group-nav-btn" id="prev-group">‹</button>
          <span id="group-label" style="font-size:13px;"></span>
          <button class="group-nav-btn" id="next-group">›</button>
        </div>
      </div>
      <div id="dancer-list"></div>
    </div>

    <!-- ── Callbacks panel ── -->
    <div id="panel-callbacks" style="display:none;">
      <div id="round-tabbar">
        <!-- filled by renderRoundTabs() -->
      </div>
      <div id="callback-content"></div>
    </div>

    <!-- ── Review & Finalize panel ── -->
    <div id="panel-review" style="display:none;">
      <div id="review-content"><p class="empty-msg">Switch to this tab to load your review.</p></div>
    </div>

  </div>

  <!-- Add Combo modal -->
  <div class="modal fade" id="addComboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:15px;">Add Combo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:600;">Name</label>
            <input type="text" id="new-combo-name" class="form-control form-control-sm" maxlength="60" autocomplete="off">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Group Size</label>
              <input type="number" id="new-combo-gs" class="form-control form-control-sm" min="1" max="200">
            </div>
            <div class="col-6">
              <label class="form-label" style="font-size:13px;font-weight:600;">Sort By</label>
              <select id="new-combo-sort" class="form-select form-select-sm">
                <option value="number">Audition #</option>
                <option value="last_name">Last Name</option>
                <option value="first_name">First Name</option>
              </select>
            </div>
          </div>
          <div id="combo-preview" style="font-size:12px;color:#8a6820;margin-top:8px;min-height:16px;"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="save-combo-btn">Add Combo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Callback Round modal -->
  <div class="modal fade" id="addRoundModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:340px;">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold" style="font-size:15px;">New Callback Round</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <input type="text" id="new-round-name" class="form-control form-control-sm"
            placeholder="e.g. Ballet Callback, Round 2" maxlength="60" autocomplete="off">
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dark btn-sm" id="save-round-btn">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="help-content.js"></script>
  <script>
  (async () => {
    // ── Auth ──────────────────────────────────────────────────────────────────
    const authRes  = await fetch('/api/auth/me');
    const authUser = await authRes.json();
    if (!authRes.ok || (authUser.mode !== 'director' && authUser.role !== 'master')) {
      window.location.href = 'login.html'; return;
    }
    document.getElementById('right-nav').innerHTML =
      `<button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    // ── Load ─────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const dayId  = params.get('id');
    if (!dayId) { window.location.href = 'audition-day.html'; return; }

    const res  = await fetch(`/api/audition-days/${dayId}`);
    if (!res.ok) { alert('Could not load audition day.'); window.location.href = 'audition-day.html'; return; }
    const data = await res.json();

    // ── State ────────────────────────────────────────────────────────────────
    let allCombos    = data.combos;
    let allDancers   = data.dancers;
    let allPieces    = data.pieces;
    let myObs        = data.myObservations;        // { comboId: { subId: { pieceId: level } } }
    let myNotes      = data.myNotes;               // { subId: body }
    let myFinal      = data.myFinalConsiderations; // { subId: { pieceId: level } }
    let cbRounds     = data.callbackRounds;        // [{ id, name, callbacks: [...] }]

    let activeComboId  = allCombos[0]?.id ?? null;
    let activePieceId  = (allPieces.find(p => p.is_mine) || allPieces[0])?.id ?? null;
    let activeTab      = 'observe';
    let activeGroupIdx = 0;
    let activeRoundId  = cbRounds[0]?.id ?? null;
    let reviewLoaded   = false;
    let cbPollTimer    = null;
    let noteTimers     = {};

    // ── Header ───────────────────────────────────────────────────────────────
    document.getElementById('day-title').textContent = data.day.name;
    if (data.day.audition_date) {
      const d = new Date(data.day.audition_date + 'T12:00:00');
      document.getElementById('day-date').textContent =
        ' · ' + d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    }
    document.body.style.visibility = 'visible';

    // ── Helpers ───────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function currentCombo() { return allCombos.find(c => c.id === activeComboId) || allCombos[0]; }

    function sortedDancers() {
      const combo = currentCombo();
      if (!combo) return [];
      return [...allDancers].sort((a, b) => {
        if (combo.sort_order === 'number') {
          const an = a.audition_number != null ? Number(a.audition_number) : Infinity;
          const bn = b.audition_number != null ? Number(b.audition_number) : Infinity;
          if (an !== bn) return an - bn;
        } else if (combo.sort_order === 'last_name') {
          const lc = (a.last_name || '').localeCompare(b.last_name || '');
          if (lc !== 0) return lc;
        } else {
          const fc = (a.first_name || '').localeCompare(b.first_name || '');
          if (fc !== 0) return fc;
        }
        return (a.last_name || '').localeCompare(b.last_name || '');
      });
    }

    function groupDancers() {
      const combo = currentCombo();
      const gs    = combo?.group_size || 8;
      const all   = sortedDancers();
      const start = activeGroupIdx * gs;
      return all.slice(start, start + gs);
    }

    function totalGroups() {
      const combo = currentCombo();
      const gs    = combo?.group_size || 8;
      return Math.ceil(allDancers.length / gs) || 1;
    }

    function getObs(comboId, subId, pieceId) {
      return myObs[String(comboId)]?.[String(subId)]?.[String(pieceId)] || null;
    }

    function priorContext(subId, pieceId) {
      const results = [];
      for (const combo of allCombos) {
        if (combo.id === activeComboId) continue;
        const level = getObs(combo.id, subId, pieceId);
        if (level) results.push({ combo, level });
      }
      return results;
    }

    function levelLabel(level) {
      return level === 'high_priority' ? 'HP' : 'P';
    }

    // ── Combo tabs ───────────────────────────────────────────────────────────
    function renderComboTabs() {
      const bar = document.getElementById('combo-tabbar');
      bar.innerHTML = '';
      allCombos.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'combo-tab' + (c.id === activeComboId ? ' active' : '');
        btn.textContent = c.name;
        btn.addEventListener('click', () => {
          activeComboId  = c.id;
          activeGroupIdx = 0;
          renderComboTabs();
          renderGroupNav();
          renderDancerList();
        });
        bar.appendChild(btn);
      });
      const addBtn = document.createElement('button');
      addBtn.id = 'add-combo-btn';
      addBtn.textContent = '+ Combo';
      addBtn.addEventListener('click', openAddComboModal);
      bar.appendChild(addBtn);
    }

    // ── Group nav ────────────────────────────────────────────────────────────
    function renderGroupNav() {
      const total = totalGroups();
      document.getElementById('group-label').textContent =
        `Group ${activeGroupIdx + 1} of ${total}`;
      document.getElementById('prev-group').disabled = activeGroupIdx === 0;
      document.getElementById('next-group').disabled = activeGroupIdx >= total - 1;
    }

    document.getElementById('prev-group').addEventListener('click', () => {
      if (activeGroupIdx > 0) { activeGroupIdx--; renderGroupNav(); renderDancerList(); }
    });
    document.getElementById('next-group').addEventListener('click', () => {
      if (activeGroupIdx < totalGroups() - 1) { activeGroupIdx++; renderGroupNav(); renderDancerList(); }
    });

    // ── Piece selector ───────────────────────────────────────────────────────
    function buildPieceSelector() {
      const sel = document.getElementById('piece-select');
      sel.innerHTML = '';
      const myPieces    = allPieces.filter(p => p.is_mine);
      const otherPieces = allPieces.filter(p => !p.is_mine);

      if (myPieces.length && otherPieces.length) {
        const g1 = document.createElement('optgroup');
        g1.label = 'Your Pieces';
        myPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; g1.appendChild(o); });
        sel.appendChild(g1);
        const g2 = document.createElement('optgroup');
        g2.label = 'Other Pieces';
        otherPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; g2.appendChild(o); });
        sel.appendChild(g2);
      } else {
        allPieces.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
      }

      if (activePieceId) sel.value = String(activePieceId);
      sel.addEventListener('change', () => {
        activePieceId = parseInt(sel.value);
        renderDancerList();
      });
    }

    // ── Dancer list ───────────────────────────────────────────────────────────
    function renderDancerList() {
      const list    = document.getElementById('dancer-list');
      const dancers = groupDancers();

      if (!activePieceId) {
        list.innerHTML = '<p class="empty-msg">Select a piece above to start rating.</p>';
        return;
      }
      if (!dancers.length) {
        list.innerHTML = '<p class="empty-msg">No dancers yet. Add auditionees from the Auditionees page.</p>';
        return;
      }

      list.innerHTML = '';
      dancers.forEach(d => renderDancerCard(list, d));
    }

    function renderDancerCard(container, d) {
      const sid      = String(d.submission_id);
      const pid      = String(activePieceId);
      const cid      = String(activeComboId);
      const level    = getObs(activeComboId, sid, pid);
      const note     = myNotes[sid] || '';
      const prior    = priorContext(sid, pid);
      const hasNote  = !!note;

      const card = document.createElement('div');
      card.className = 'dancer-card' +
        (level === 'high_priority' ? ' has-hp' : level === 'priority' ? ' has-p' : '') +
        (hasNote ? ' has-note' : '');
      card.dataset.sid = sid;

      const numStr = d.audition_number != null ? `<span class="dancer-num">#${d.audition_number}</span>` : '';
      const nameStr = `${escHtml(d.first_name)} ${escHtml(d.last_name)}`;

      // Prior context line
      let priorHtml = '';
      if (prior.length) {
        const parts = prior.map(r => {
          const cls = r.level === 'high_priority' ? 'prior-hp' : 'prior-p';
          return `<span><span class="text-muted">${escHtml(r.combo.name)}:</span> <span class="${cls}">${levelLabel(r.level)}</span></span>`;
        });
        priorHtml = `<div class="prior-context">${parts.join('')}</div>`;
      }

      // Note textarea (hidden unless has note or user opens it)
      const noteId  = `note-${sid}`;
      const noteHtml = `<textarea id="${noteId}" class="note-field" placeholder="Add a note…" rows="2">${escHtml(note)}</textarea>`;

      card.innerHTML = `
        <div class="dancer-name">${numStr}${nameStr}</div>
        <div class="obs-btns">
          <button class="obs-btn${level === 'priority' ? ' active-p' : ''}" data-level="priority">P</button>
          <button class="obs-btn${level === 'high_priority' ? ' active-hp' : ''}" data-level="high_priority">HP</button>
          <button class="note-btn${hasNote ? ' has-note' : ''}" data-note-toggle="${sid}" title="Note">✏</button>
        </div>
        ${priorHtml}
        <div id="note-area-${sid}" style="display:${hasNote ? '' : 'none'};">${noteHtml}</div>
      `;

      // P / HP tap
      card.querySelectorAll('.obs-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleObs(d.submission_id, btn.dataset.level, card));
      });

      // Note toggle
      card.querySelector(`[data-note-toggle="${sid}"]`).addEventListener('click', () => {
        const area = document.getElementById(`note-area-${sid}`);
        area.style.display = area.style.display === 'none' ? '' : 'none';
        if (area.style.display !== 'none') area.querySelector('textarea').focus();
      });

      // Note autosave
      const ta = card.querySelector(`#${noteId}`);
      ta.addEventListener('input', () => {
        clearTimeout(noteTimers[sid]);
        noteTimers[sid] = setTimeout(() => saveNote(d.submission_id, ta.value), 1200);
      });

      container.appendChild(card);
    }

    async function toggleObs(submissionId, level, card) {
      const sid  = String(submissionId);
      const pid  = String(activePieceId);
      const cid  = String(activeComboId);
      const cur  = getObs(activeComboId, sid, pid);
      const next = cur === level ? null : level;

      // Update local state
      if (!myObs[cid]) myObs[cid] = {};
      if (!myObs[cid][sid]) myObs[cid][sid] = {};
      if (next) myObs[cid][sid][pid] = next;
      else delete myObs[cid][sid][pid];

      // Update card UI without full re-render
      card.querySelectorAll('.obs-btn').forEach(btn => {
        btn.className = 'obs-btn' +
          (btn.dataset.level === 'priority' && next === 'priority' ? ' active-p' : '') +
          (btn.dataset.level === 'high_priority' && next === 'high_priority' ? ' active-hp' : '');
      });
      card.className = 'dancer-card' +
        (next === 'high_priority' ? ' has-hp' : next === 'priority' ? ' has-p' : '') +
        (card.classList.contains('has-note') ? ' has-note' : '');

      await fetch(`/api/audition-days/${dayId}/observations`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ combo_id: activeComboId, submission_id: submissionId, piece_id: activePieceId, level: next }),
      }).catch(() => {});
    }

    async function saveNote(submissionId, body) {
      const sid = String(submissionId);
      const trimmed = body.trim();
      if (trimmed) myNotes[sid] = trimmed; else delete myNotes[sid];

      // Update note button icon
      const btn = document.querySelector(`[data-note-toggle="${sid}"]`);
      if (btn) btn.className = 'note-btn' + (trimmed ? ' has-note' : '');
      // Update card style
      const card = document.querySelector(`.dancer-card[data-sid="${sid}"]`);
      if (card) {
        if (trimmed) card.classList.add('has-note'); else card.classList.remove('has-note');
      }

      await fetch(`/api/audition-days/${dayId}/notes/${submissionId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body }),
      }).catch(() => {});
    }

    // ── Callback rounds ────────────────────────────────────────────────────────
    function renderRoundTabs() {
      const bar = document.getElementById('round-tabbar');
      bar.innerHTML = '';
      cbRounds.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'round-tab' + (r.id === activeRoundId ? ' active' : '');
        btn.textContent = r.name;
        btn.addEventListener('click', () => {
          activeRoundId = r.id;
          renderRoundTabs();
          renderCallbackContent();
        });
        bar.appendChild(btn);
      });
      const addBtn = document.createElement('button');
      addBtn.id = 'add-round-btn';
      addBtn.textContent = '+ Round';
      addBtn.addEventListener('click', () =>
        new bootstrap.Modal(document.getElementById('addRoundModal')).show()
      );
      bar.appendChild(addBtn);
    }

    function renderCallbackContent() {
      const round   = cbRounds.find(r => r.id === activeRoundId);
      const content = document.getElementById('callback-content');
      if (!round) { content.innerHTML = '<p class="empty-msg">No callback rounds yet.</p>'; return; }

      const calledBackIds = new Set((round.callbacks || []).map(c => String(c.submission_id)));
      const attrMap = {};
      (round.callbacks || []).forEach(c => { attrMap[String(c.submission_id)] = c.added_by_name; });

      // Called-back dancers first, then rest
      const sorted = sortedDancers();
      const calledBack = sorted.filter(d => calledBackIds.has(String(d.submission_id)));
      const others     = sorted.filter(d => !calledBackIds.has(String(d.submission_id)));

      content.innerHTML = '';

      if (calledBack.length) {
        const hdr = document.createElement('div');
        hdr.style.cssText = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#c9a84c;margin-bottom:6px;';
        hdr.textContent = `Called Back (${calledBack.length})`;
        content.appendChild(hdr);
        calledBack.forEach(d => appendCallbackRow(content, d, true, attrMap[String(d.submission_id)], round.id));
        const sep = document.createElement('div');
        sep.style.cssText = 'margin:12px 0 8px;border-top:1px solid #e8dfc8;';
        content.appendChild(sep);
      }

      others.forEach(d => appendCallbackRow(content, d, false, null, round.id));
    }

    function appendCallbackRow(container, d, isCallback, attr, roundId) {
      const row = document.createElement('div');
      row.className = 'callback-row' + (isCallback ? ' is-callback' : '');
      row.dataset.sid = String(d.submission_id);

      const numStr  = d.audition_number != null ? `<span class="cb-num">#${d.audition_number}</span>` : '';
      const attrStr = isCallback && attr ? `<div class="callback-attribution">Added by ${escHtml(attr)}</div>` : '';

      row.innerHTML = `
        <div>
          <div class="callback-name">${numStr}${escHtml(d.first_name)} ${escHtml(d.last_name)}</div>
          ${attrStr}
        </div>
        <button class="cb-toggle${isCallback ? ' active' : ''}">${isCallback ? '✓ Called Back' : '+ Callback'}</button>
      `;

      row.querySelector('.cb-toggle').addEventListener('click', () => toggleCallback(d.submission_id, roundId));
      container.appendChild(row);
    }

    async function toggleCallback(submissionId, roundId) {
      const res = await fetch(
        `/api/audition-days/${dayId}/callback-rounds/${roundId}/callbacks/${submissionId}`,
        { method: 'POST' }
      ).catch(() => null);
      if (!res?.ok) return;
      await refreshCallbackRounds();
    }

    async function refreshCallbackRounds() {
      const r = await fetch(`/api/audition-days/${dayId}/callback-rounds`).catch(() => null);
      if (r?.ok) {
        cbRounds = await r.json();
        if (activeTab === 'callbacks') {
          renderRoundTabs();
          renderCallbackContent();
        }
      }
    }

    function startCallbackPoll() {
      if (cbPollTimer) return;
      cbPollTimer = setInterval(() => {
        if (activeTab === 'callbacks') refreshCallbackRounds();
      }, 8000);
    }

    // ── Review & Finalize ──────────────────────────────────────────────────────
    async function loadReview() {
      const el = document.getElementById('review-content');
      el.innerHTML = '<p class="empty-msg">Loading…</p>';
      const r   = await fetch(`/api/audition-days/${dayId}/review`).catch(() => null);
      if (!r?.ok) { el.innerHTML = '<p class="empty-msg">Could not load review.</p>'; return; }
      const rv = await r.json();
      reviewLoaded = true;

      if (!rv.dancers.length) {
        el.innerHTML = '<p class="empty-msg">No dancers flagged yet. Rate dancers in the Observe tab first.</p>';
        return;
      }

      el.innerHTML = '';
      const combos = rv.combos;

      rv.dancers.forEach(d => {
        const card = document.createElement('div');
        card.className = 'review-card';
        card.dataset.sid = String(d.submission_id);

        const numStr = d.audition_number != null ? `<span style="color:#aaa;font-weight:400;font-size:13px;">#${d.audition_number} </span>` : '';

        let obsHtml = '';
        const obsByPiece = d.observations || {};
        for (const [pid, obsData] of Object.entries(obsByPiece)) {
          const comboItems = combos.map(c => {
            const level = obsData.byCombo?.[String(c.id)];
            if (!level) return '';
            const cls = level === 'high_priority' ? 'prior-hp' : 'prior-p';
            return `<span class="review-combo-item"><span class="text-muted">${escHtml(c.name)}:</span> <span class="${cls}">${levelLabel(level)}</span></span>`;
          }).filter(Boolean).join('');
          if (comboItems) {
            obsHtml += `<div class="review-obs-row"><span class="review-obs-piece">${escHtml(obsData.piece_name)}</span><br>${comboItems}</div>`;
          }
        }

        const noteHtml = d.note ? `<div class="review-note">${escHtml(d.note)}</div>` : '';

        // Final consideration rows — one per piece that has any observation
        const relevantPieces = [...new Set([
          ...Object.keys(obsByPiece).map(Number),
          ...Object.keys(d.finalConsiderations || {}).map(Number),
        ])];

        let finalHtml = '';
        if (relevantPieces.length) {
          const rows = relevantPieces.map(pid => {
            const piece    = allPieces.find(p => p.id === pid);
            const pName    = piece?.name || '(Piece)';
            const current  = (d.finalConsiderations || {})[String(pid)]?.level || null;
            return `
              <div class="final-piece-row">
                <span class="final-piece-name">${escHtml(pName)}</span>
                <div class="final-btns">
                  <button class="final-btn${current === 'priority' ? ' active-p' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="priority">P</button>
                  <button class="final-btn${current === 'high_priority' ? ' active-hp' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="high_priority">HP</button>
                  <button class="final-btn${current === 'not_considering' ? ' active-nc' : ''}" data-sub="${d.submission_id}" data-piece="${pid}" data-level="not_considering">Not considering</button>
                </div>
              </div>`;
          }).join('');
          finalHtml = `<div class="review-final-row"><div class="review-final-label">Final Consideration</div>${rows}</div>`;
        }

        card.innerHTML = `
          <div class="review-dancer-name">${numStr}${escHtml(d.first_name)} ${escHtml(d.last_name)}</div>
          ${obsHtml}${noteHtml}${finalHtml}
        `;

        // Wire final consideration buttons
        card.querySelectorAll('.final-btn').forEach(btn => {
          btn.addEventListener('click', () => saveFinal(
            parseInt(btn.dataset.sub),
            parseInt(btn.dataset.piece),
            btn.dataset.level,
            btn,
            card
          ));
        });

        el.appendChild(card);
      });
    }

    async function saveFinal(submissionId, pieceId, level, clickedBtn, card) {
      const sid = String(submissionId);
      const pid = String(pieceId);

      // Toggle off if same
      const current = myFinal[sid]?.[pid];
      const next    = current === level ? null : level;

      if (!myFinal[sid]) myFinal[sid] = {};
      if (next) myFinal[sid][pid] = next; else delete myFinal[sid][pid];

      // Update button states in review card
      card.querySelectorAll(`.final-btn[data-sub="${submissionId}"][data-piece="${pieceId}"]`).forEach(btn => {
        btn.className = 'final-btn' +
          (btn.dataset.level === 'priority' && next === 'priority' ? ' active-p' : '') +
          (btn.dataset.level === 'high_priority' && next === 'high_priority' ? ' active-hp' : '') +
          (btn.dataset.level === 'not_considering' && next === 'not_considering' ? ' active-nc' : '');
      });

      await fetch(`/api/audition-days/${dayId}/final-considerations`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ submission_id: submissionId, piece_id: pieceId, level: next }),
      }).catch(() => {});
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    document.querySelectorAll('.main-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-observe').style.display    = activeTab === 'observe'    ? '' : 'none';
        document.getElementById('panel-callbacks').style.display  = activeTab === 'callbacks'  ? '' : 'none';
        document.getElementById('panel-review').style.display     = activeTab === 'review'     ? '' : 'none';

        if (activeTab === 'callbacks') { startCallbackPoll(); renderRoundTabs(); renderCallbackContent(); }
        if (activeTab === 'review' && !reviewLoaded) loadReview();
      });
    });

    // ── Add Combo modal ───────────────────────────────────────────────────────
    function openAddComboModal() {
      const last = allCombos[allCombos.length - 1];
      document.getElementById('new-combo-name').value  = `Combo ${allCombos.length + 1}`;
      document.getElementById('new-combo-gs').value    = last ? String(last.group_size) : '8';
      document.getElementById('new-combo-sort').value  = last ? last.sort_order : 'number';
      updateComboPreview();
      new bootstrap.Modal(document.getElementById('addComboModal')).show();
    }

    function updateComboPreview() {
      const gs = parseInt(document.getElementById('new-combo-gs').value) || 0;
      const n  = allDancers.length;
      const el = document.getElementById('combo-preview');
      if (!gs || !n) { el.textContent = ''; return; }
      if (gs > n) { el.textContent = `Max group size is ${n}.`; el.style.color = '#c0392b'; return; }
      el.style.color = '#8a6820';
      const g   = Math.ceil(n / gs);
      const rem = n % gs;
      const last = rem > 0 ? ` Last group has ${rem} dancer${rem !== 1 ? 's' : ''}.` : '';
      el.textContent = `${n} dancers · ${gs} per group = ${g} group${g !== 1 ? 's' : ''}.${last}`;
    }
    document.getElementById('new-combo-gs').addEventListener('input', updateComboPreview);

    document.getElementById('save-combo-btn').addEventListener('click', async () => {
      const btn  = document.getElementById('save-combo-btn');
      const name = document.getElementById('new-combo-name').value.trim();
      const gs   = parseInt(document.getElementById('new-combo-gs').value) || 8;
      const so   = document.getElementById('new-combo-sort').value;
      btn.disabled = true;
      try {
        const r   = await fetch(`/api/audition-days/${dayId}/combos`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name || `Combo ${allCombos.length + 1}`, group_size: gs, sort_order: so }),
        });
        if (!r.ok) { alert('Could not add combo.'); return; }
        const combo = await r.json();
        allCombos.push(combo);
        activeComboId  = combo.id;
        activeGroupIdx = 0;
        bootstrap.Modal.getInstance(document.getElementById('addComboModal')).hide();
        renderComboTabs();
        renderGroupNav();
        renderDancerList();
      } finally { btn.disabled = false; }
    });

    // ── Add Round modal ───────────────────────────────────────────────────────
    document.getElementById('save-round-btn').addEventListener('click', async () => {
      const btn  = document.getElementById('save-round-btn');
      const name = document.getElementById('new-round-name').value.trim();
      if (!name) return;
      btn.disabled = true;
      try {
        const r = await fetch(`/api/audition-days/${dayId}/callback-rounds`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!r.ok) { alert('Could not create round.'); return; }
        const round = await r.json();
        cbRounds.push(round);
        activeRoundId = round.id;
        bootstrap.Modal.getInstance(document.getElementById('addRoundModal')).hide();
        document.getElementById('new-round-name').value = '';
        renderRoundTabs();
        renderCallbackContent();
      } finally { btn.disabled = false; }
    });

    // ── Initial render ────────────────────────────────────────────────────────
    buildPieceSelector();
    renderComboTabs();
    renderGroupNav();
    renderDancerList();
    renderRoundTabs();

  })();
  </script>
</body>
</html>
