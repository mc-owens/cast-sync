<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Private Notes | CastSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    .note-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; background: #fff; }
    .note-meta { font-size: 12px; color: #888; }
    .note-text { font-size: 14px; white-space: pre-wrap; margin: 6px 0; }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body style="visibility:hidden">

  <div id="app-shell-root"></div>
  <script src="app-shell-staff.js"></script>

  <div class="app-main">
    <div class="container-fluid mt-4 px-4" style="max-width:700px;">

      <div class="mb-3">
        <h5 class="mb-0 fw-semibold">My Private Notes</h5>
        <p class="text-muted mb-0" style="font-size:13px;">Private notes only you can see. Use them for ideas, reminders, or anything you want to keep track of.</p>
      </div>

      <div class="border rounded p-3 mb-4" style="background:#fafafa;">
        <textarea id="note-text" class="form-control mb-2" rows="4" placeholder="Write a note…"></textarea>
        <button id="add-note-btn" class="btn btn-dark btn-sm">Add Note</button>
        <span id="note-error" class="text-danger ms-2 d-none" style="font-size:13px;"></span>
      </div>

      <div id="notes-loading" class="text-muted" style="font-size:14px;">Loading…</div>
      <div id="notes-list"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +
             ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    async function loadNotes() {
      document.getElementById('notes-loading').style.display = '';
      document.getElementById('notes-loading').textContent = 'Loading…';
      document.getElementById('notes-list').innerHTML = '';
      try {
        const res = await fetch('/api/my-notes');
        if (!res.ok) throw new Error();
        const notes = await res.json();
        document.getElementById('notes-loading').style.display = 'none';
        const list = document.getElementById('notes-list');
        if (notes.length === 0) {
          list.innerHTML = '<p class="text-muted" style="font-size:13px;">No notes yet. Add your first one above.</p>';
          return;
        }
        list.innerHTML = notes.map(n => `
          <div class="note-card" data-id="${n.id}">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <span class="note-meta">${formatDate(n.created_at)}</span>
              <span style="display:flex;gap:10px;align-items:center;">
                <button class="edit-btn btn btn-link p-0" style="font-size:13px;line-height:1;color:#374151;" data-id="${n.id}">Edit</button>
                <button class="delete-btn btn btn-link text-danger p-0" style="font-size:13px;line-height:1;" data-id="${n.id}">Delete</button>
              </span>
            </div>
            <div class="note-text" data-raw="${escapeHtml(n.note_text)}">${escapeHtml(n.note_text)}</div>
          </div>`).join('');
      } catch (_) {
        document.getElementById('notes-loading').textContent = 'Could not load notes.';
      }
    }

    document.getElementById('notes-list').addEventListener('click', async e => {
      if (e.target.closest('.delete-btn')) {
        const btn = e.target.closest('.delete-btn');
        const id = btn.dataset.id;
        if (!confirm('Delete this note?')) return;
        try {
          const res = await fetch(`/api/my-notes/${id}`, { method: 'DELETE' });
          if (res.ok) loadNotes();
        } catch (_) {}
        return;
      }
      if (e.target.closest('.edit-btn')) {
        const btn = e.target.closest('.edit-btn');
        const id = btn.dataset.id;
        const card = btn.closest('.note-card');
        const textEl = card.querySelector('.note-text');
        if (textEl.querySelector('textarea')) return; // already editing
        const original = textEl.dataset.raw;
        textEl.innerHTML = `
          <textarea class="form-control form-control-sm mb-2" rows="4" style="font-size:14px;">${escapeHtml(original)}</textarea>
          <div style="display:flex;gap:8px;">
            <button class="save-edit-btn btn btn-dark btn-sm">Save</button>
            <button class="cancel-edit-btn btn btn-outline-secondary btn-sm">Cancel</button>
            <span class="edit-err text-danger" style="font-size:12px;align-self:center;"></span>
          </div>`;
        textEl.querySelector('.cancel-edit-btn').addEventListener('click', () => {
          textEl.innerHTML = escapeHtml(original);
          textEl.dataset.raw = original;
        });
        textEl.querySelector('.save-edit-btn').addEventListener('click', async () => {
          const newText = textEl.querySelector('textarea').value.trim();
          const errEl = textEl.querySelector('.edit-err');
          if (!newText) { errEl.textContent = 'Note cannot be empty.'; return; }
          try {
            const r = await fetch(`/api/my-notes/${id}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ note_text: newText }),
            });
            if (!r.ok) { errEl.textContent = 'Could not save.'; return; }
            textEl.innerHTML = escapeHtml(newText);
            textEl.dataset.raw = newText;
          } catch (_) { errEl.textContent = 'Could not connect.'; }
        });
        return;
      }
    });

    document.getElementById('add-note-btn').addEventListener('click', async () => {
      const noteText = document.getElementById('note-text').value.trim();
      const errEl = document.getElementById('note-error');
      errEl.classList.add('d-none');
      if (!noteText) { errEl.textContent = 'Note text is required.'; errEl.classList.remove('d-none'); return; }
      const btn = document.getElementById('add-note-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/my-notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ note_text: noteText }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || 'Could not save note.';
          errEl.classList.remove('d-none');
          return;
        }
        document.getElementById('note-text').value = '';
        await loadNotes();
      } catch (_) {
        errEl.textContent = 'Could not connect to server.';
        errEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
      }
    });
  </script>

  <script>
    (async () => {
      try {
        const res  = await fetch('/api/auth/me');
        const user = await res.json();
        if (!res.ok || (!user.isStaff && user.role !== 'staff')) { window.location.href = 'login.html'; return; }
        document.getElementById('right-nav').innerHTML =
          `<a href="account.html">Account</a>` +
          (user.isDirector ? `<button id="switch-director-btn">Switch to Director</button>` : '') +
          `<button id="switch-auditionee-btn">Switch to Auditionee</button>
           <button class="btn-nav-logout" id="logout-btn">Log Out</button>`;
        if (user.isDirector) {
          document.getElementById('switch-director-btn').addEventListener('click', async () => {
            await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'director' }) });
            window.location.href = 'org-select.html';
          });
        }
        document.getElementById('switch-auditionee-btn').addEventListener('click', async () => {
          await fetch('/api/auth/switch-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'auditionee' }) });
          window.location.href = 'auditionForm.html';
        });
        document.getElementById('logout-btn').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = 'login.html';
        });
        document.body.style.visibility = 'visible';
        loadNotes();
      } catch (_) {
        window.location.href = 'login.html';
      }
    })();
  </script>

  </div>
</body>
</html>
